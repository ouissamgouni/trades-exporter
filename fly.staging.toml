# Fly.io app configuration — staging
# Differences vs fly.toml: separate app name, sleeps when idle.

app = "trades-exporter-staging"
primary_region = "cdg"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "debug"
  ENV_NAME = "staging"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/api/v1/health"
    protocol = "http"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

swap_size_mb = 512
