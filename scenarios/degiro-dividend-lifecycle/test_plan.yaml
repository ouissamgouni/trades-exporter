# Expected FX rates for verification (approximate)
fx_rates:
  USD_EUR: 0.92  # approximate 2025 rate
  CHF_EUR: 0.97  # approximate 2025 rate

# Expected PFU tax calculation for 2025 (in EUR, approximate)
expected_tax_summary:
  fiscal_year: 2025
  note: >
    PFU = 30% of gross. WHT credit limited to 12.8% of gross.
    US dividends: 30% WHT, fully creditable against 12.8% IR portion.
    FR dividends: 30% WHT, fully creditable.
    CH dividends: 35% WHT, only 12.8% creditable (excess 22.2% lost).
