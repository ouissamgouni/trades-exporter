    label: "Apple Inc"
    isin: "US0378331005"
    price_type: "stock"
  - symbol: "MSFT"
    label: "Microsoft Corp"
    isin: "US5949181045"
    price_type: "stock"
  - symbol: "TTE"
    label: "TotalEnergies SE"
    isin: "FR0000120271"
    price_type: "stock"
  - symbol: "NESN"
    label: "Nestlé SA"
    isin: "CH0038863350"
