# Product Demo Scenario — Transactions
# =======================================
# Fake, self-consistent portfolio narrative spanning 2024-01 through today,
# for customer-facing product demos. Prices/quantities/dates are entirely
# fabricated (see prices.yaml for the matching fake-but-reasonable price
# waypoints, seeded via the mock price getter).
#
# Narrative:
#   - Binance/Coinbase/OKX/MEXC: crypto spot DCA + profit-taking + one
#     internal transfer (Binance -> MEXC) to exercise transfer detection.
#   - Hyperliquid: perp trading (funded from Binance) with a win, a loss,
#     a funding payment, and a fee-bearing close.
#   - Degiro: international stock buys/sells (AAPL/MSFT/GOOGL/ASML).
#   - Linxea Vie: long-term ETF (CW8) accumulation, tax-advantaged wrapper.
#   - Revolut: EUR -> USD FX round-trip.
#   - Ledger wallets: self-custody transfers out of CEX/DEX accounts.
#   - Ledger Polygon: Polymarket prediction-market positions — one resolved
#     win, one resolved loss, one partially sold (still open), one fully
#     open — authored directly as trades (buy = inflow, resolution/sell =
#     outflow at 1.00/0.00 USDC), equivalent to how the Polymarket connector
#     represents BUY/SELL/REDEEM.

