# Product Demo Scenario — Accounts
# ==================================
# Fake but realistic multi-account portfolio for customer-facing demos.
# Covers every AccountType (cex, dex, broker, wallet, bank, investment) and a
# broad spread of connector families. All connectors are seeded as *disabled*
# decorative entries (no real API credentials in a demo environment) — every
# transaction shown comes from transactions.yaml so the demo works fully
# offline and reproducibly. Use with: task start:scenario SCENARIO=demo

accounts:
  # =========================================================================
  # CEX Accounts
  # =========================================================================

  - name: "Binance"
    account_type: "cex"
    owned: true
    group: "Trading"
    color: "#F0B90B"
    address_or_identifier: "binance_demo"
    tags:
      - trading: true
      - spot: true
    connectors:
      - connector_type: "binance-transactions"
        color: "#1A4971"
        enabled: false
        sync_priority: 10
        config:
          start_datetime: "2024-01-01T00:00:00"

      - connector_type: "binance-deposits"
        color: "#1E7A6D"
        enabled: false
        sync_priority: 20
        config:
          start_datetime: "2024-01-01T00:00:00"

      - connector_type: "binance-withdrawals"
        color: "#3A7D44"
        enabled: false
        sync_priority: 30
        config:
          start_datetime: "2024-01-01T00:00:00"

