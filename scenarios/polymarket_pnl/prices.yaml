prices:
  # ── USDC → EUR (base currency) ──────────────────────────────────
  # Needed for every leg that involves USDC (cost basis conversion).
  # Timestamps must be within ±15 min of transaction date_time.
  - asset_symbol: USDC
    quote_currency: EUR
    entries:
      - at: "2024-09-01T10:00:00" # Buy 2000 USDC on Binance
        price: "0.92"
      - at: "2024-09-05T14:00:00" # Transfer 1500 USDC to Polymarket
        price: "0.92"
      - at: "2024-10-15T12:00:00" # Buy rain-friday + eth-5k shares
        price: "0.92"
      - at: "2024-10-16T00:00:00" # Buy superbowl shares
        price: "0.92"
      - at: "2024-10-17T12:00:00" # Case 3+4: BUY partial-sell-win/loss
        price: "0.92"
      - at: "2024-10-18T12:00:00" # Case 3+4: SELL partial-sell-win/loss
        price: "0.92"
      - at: "2024-10-19T12:00:00" # Case 5: BUY full-exit
        price: "0.92"
      - at: "2024-10-20T12:00:00" # Case 5: SELL full-exit
        price: "0.92"
      - at: "2024-10-21T12:00:00" # Case 6: BUY1 reentry
        price: "0.92"
      - at: "2024-10-22T12:00:00" # Case 6: SELL reentry
        price: "0.92"
      - at: "2024-10-23T12:00:00" # Case 6: BUY2 reentry
        price: "0.92"
      - at: "2024-11-08T00:00:00" # Redeem rain-friday + sell eth-5k
        price: "0.92"
      - at: "2024-11-09T00:00:00" # Case 3: Redeem partial-sell-win
        price: "0.92"
      - at: "2024-11-10T00:00:00" # Redeem superbowl
        price: "0.92"
      - at: "2024-11-11T00:00:00" # Case 6: Redeem reentry
        price: "0.92"
      - at: current
        price: "0.92"

  # ── PM shares ───────────────────────────────────────────────────
  # All markets are resolved in this scenario (no open positions),
  # so current price = 0. Historical prices at trade dates prevent
  # any external API calls during PnL calculation.

  - asset_symbol: "PM:rain-friday-Yes"
    quote_currency: USDC
    entries:
      - at: "2024-10-15T12:00:00" # BUY 100 @ 0.60
        price: "0.60"
      - at: "2024-11-08T00:00:00" # Resolution synthetic @ 1.00 (win)
        price: "1.00"
      - at: current # Resolved — no open position
        price: "0"

  - asset_symbol: "PM:eth-5k-Yes"
    quote_currency: USDC
    entries:
      - at: "2024-10-15T12:00:00" # BUY 200 @ 0.50
        price: "0.50"
      - at: "2024-11-08T00:00:00" # Synthetic SELL @ 0.00 (loss)
        price: "0"
      - at: current # Resolved — no open position
        price: "0"

  - asset_symbol: "PM:superbowl-No"
    quote_currency: USDC
    entries:
      - at: "2024-10-16T00:00:00" # BUY 150 @ 0.35
        price: "0.35"
      - at: "2024-11-10T00:00:00" # Resolution synthetic @ 1.00 (win)
        price: "1.00"
      - at: current # Resolved — no open position
        price: "0"

  # ── Case 3: Partial Sell + Win ──────────────────────────────────
  - asset_symbol: "PM:partial-sell-win-Yes"
    quote_currency: USDC
    entries:
      - at: "2024-10-17T12:00:00" # BUY 100 @ 0.40
        price: "0.40"
      - at: "2024-10-18T12:00:00" # SELL 40 @ 0.70
        price: "0.70"
      - at: "2024-11-09T00:00:00" # Resolution synthetic @ 1.00 (win, 60 shares)
        price: "1.00"
      - at: current # Resolved — no open position
        price: "0"

  # ── Case 4: Partial Sell + Loss ─────────────────────────────────
  - asset_symbol: "PM:partial-sell-loss-Yes"
    quote_currency: USDC
    entries:
      - at: "2024-10-17T12:00:00" # BUY 100 @ 0.40
        price: "0.40"
      - at: "2024-10-18T12:00:00" # SELL 40 @ 0.70
        price: "0.70"
      - at: "2024-11-08T00:00:00" # Synthetic CLOSE @ 0 (loss, 60 shares)
        price: "0"
      - at: current # Resolved — no open position
        price: "0"

  # ── Case 5: Full Exit Before Resolution ─────────────────────────
  - asset_symbol: "PM:full-exit-Yes"
    quote_currency: USDC
    entries:
      - at: "2024-10-19T12:00:00" # BUY 100 @ 0.40
        price: "0.40"
      - at: "2024-10-20T12:00:00" # SELL 100 @ 0.60
        price: "0.60"
      - at: current # Fully exited — no position
        price: "0"

  # ── Case 6: Re-entry After Full Exit ────────────────────────────
  - asset_symbol: "PM:reentry-Yes"
    quote_currency: USDC
    entries:
      - at: "2024-10-21T12:00:00" # BUY1 100 @ 0.40
        price: "0.40"
      - at: "2024-10-22T12:00:00" # SELL 100 @ 0.60
        price: "0.60"
      - at: "2024-10-23T12:00:00" # BUY2 100 @ 0.70
        price: "0.70"
      - at: "2024-11-11T00:00:00" # Resolution synthetic @ 1.00 (win)
        price: "1.00"
      - at: current # Resolved — no open position
        price: "0"
