# Private Accounts Scenario
# ==========================
# Personal accounts and connectors configuration.
# Use with: task start:scenario SCENARIO=private-accounts
#
# This is the original personal seed data, moved to a scenario so that
# the default seed_data/ contains only generic sample data.

accounts:
  # =========================================================================
  # CEX Accounts
  # =========================================================================

  # Binance Main Account
  - name: "Binance"
    account_type: "cex"
    owned: true
    group: "Trading"
    color: "#1F6F9F"
    address_or_identifier: "binance_main"
    tags:
      - trading: true
      - spot: true
    connectors:
      - connector_type: "binance-transactions"
        color: "#1A4971"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 10
        config:
          start_datetime: "2025-10-01T00:00:00"

      - connector_type: "binance-deposits"
        color: "#1E7A6D"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 20
        config:
          start_datetime: "2025-10-01T00:00:00"

      - connector_type: "binance-withdrawals"
        color: "#3A7D44"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 30
        config:
          start_datetime: "2025-10-01T00:00:00"

  # MEXC Account
  - name: "MEXC"
