# DeGiro Account Normalization Scenario — Transactions
# ===============================================================
# No transactions are pre-seeded. The test flow is:
#   1. Seed the scenario (creates account + assets only)
#   2. Upload fixtures/Account.csv via the degiro-account-file connector
#   3. Sync → connector creates 9 normalized transactions
#   4. Verify the created transactions match expected output below
#
# CSV has 15 rows. After classification and filtering:
#   - 3 WITHHOLDING rows → merged into matching DIVIDEND, then marked SKIP
#   - 1 SKIP row (trade with Order Id, empty description)
#   - 2 FX_STANDALONE rows → not handled by connector (known gap)
#   → 9 normalizable rows = 9 expected transactions
#
# Note: Withholding jurisdiction is inferred from ISIN country prefix.
# Only US, DE, IE, NL, FR are mapped. GB (Rolls Royce) is not mapped
# so withholding_jurisdiction is null for that dividend.

transactions: []

