# Economic vs Tax Cost Basis — QA Test Plan
# ==========================================
# Each lot carries two costs:
#   - Cost (economic): market value when the asset was received.
#   - Tax cost: original purchase cost carried through tax-deferred swaps.
# Vocabulary used in the UI:
#   Realized     = proceeds − cost (each gain counted once)
#   Taxable      = proceeds − tax cost, on taxable disposals only
#   Deferred     = gain already in Realized but not taxed yet (cost − tax cost of open lots)
#   Deferred in  = per entry: Taxable gain − Realized (released when taxable, rolled over otherwise)
#   Net deposits = money brought in from outside − money taken out
# Identity (whole portfolio): Realized = Taxable + Deferred → 14 200 = 9 200 + 5 000.
#
# Transactions: A0 deposit 31 000 EUR · A1 buy 1 BTC @ 30 000 · A2 swap BTC → 16 ETH (FMV 40 000)
# · A3 transfer 8 ETH Exchange → Cold Wallet · A4 swap 8 ETH → 24 000 USDC · A5 sell USDC → EUR
# · B1 buy 10 SOL @ 100 · B2 sell 4 SOL @ 150. Prices now: ETH 3 000, SOL 150.

test_plan:
  name: "Economic vs Tax Cost Basis — Tax-Deferred Swaps"
  description: >
    A chain of non-taxable swaps (BTC → ETH → USDC) with a transfer in between,
    then a taxable sale to EUR, plus a plain buy/sell control case. Checks the
    Realized / Taxable / Deferred totals, per-entry explanations, lots in both
    views, net deposits, the P&L audit table and the transaction P&L section.

  preconditions:
    - "Frontend http://localhost:3790, API http://localhost:8790 (scenario ports)."
    - "Default settings: crypto-to-crypto swaps are not taxable."

  commands:
    - "task start:scenario SCENARIO=economic-vs-tax-basis RESET=1"

  steps:
    # ── Setup ──────────────────────────────────────────────────
    - id: 1
      title: "Seed and calculate"
      actions:
        - do: "Open Setup and check the seeded data."
          expect: "9 transactions, 5 assets (EUR, BTC, ETH, USDC, SOL), 2 accounts (Exchange, Cold Wallet)."
        - do: "Open P&L and run Calculate (or call the API)."
          run: "curl -s -X POST localhost:8790/pnl/calculate -H 'Content-Type: application/json' -d '{\"base_currency_symbol\": \"EUR\"}'"
          expect: "A version is created with 0 warnings and 4 realized entries (A2, A4, A5, B2)."

    # ── Overview totals ────────────────────────────────────────
    - id: 2
      title: "Overview totals: Realized, Taxable, Deferred"
      actions:
        - do: "P&L page, range All, Overview section: read the Realized card."
          expect: "Realized +14.2K € with two lines: Taxable +9.2K € and Deferred +5.0K €."
        - do: "Hover the info icons next to Realized, Taxable and Deferred."
          expect: "Each shows a short explanation; tooltips appear above any open panel."
        - do: "Read the Cost and Unrealized cards."
          expect: "Cost 45.2K € with 'Net deposits: 31.0K €' (info icon). Unrealized +4.3K €. Total return +18.5K € = Value 49.5K − Net deposits 31K."
        - run: "curl -s localhost:8790/pnl/versions/1/metrics/book | python3 -m json.tool | head -20"
          expect: "realized_pnl 14200, taxable_realized_pnl 9200, deferred_gain 5000, net_deposits 31000."

    - id: 3
      title: "Assets section"
      actions:
        - do: "Assets section: read the totals bar above the cards."
          expect: "Realized +14.2K € with Taxable +9.2K € and Deferred +5.0K €."
        - do: "Read the Ethereum card."
          expect: "Cost €20.0K, 'bought €40.0K'. Unrealized €4.0K and 'Taxable if sold: €9.0K' (= 4K unrealized + 5K deferred). Realized €4.0K, no Taxable line."
        - do: "Read the Bitcoin, USD Coin and Solana cards."
          expect: "BTC Realized €10.0K (not taxable). USDC Realized €0, Taxable €9.0K. SOL Realized €200, Taxable €200, no 'Taxable if sold' line (both costs equal)."

    # ── Realized entries ───────────────────────────────────────
    - id: 4
      title: "Realized P&L panel"
      actions:
        - do: "Audit section → click the Realized P&L stat card."
          expect: "Columns: Cost, Chain, Realized, Taxable gain, Deferred in, Taxability (text pill), Origin, Days, TX, Unit."
        - do: "Check each row."
          expect: >
            A2 BTC: Realized +10 000, Taxable gain —, Deferred in —, pill 'Deferred'.
            A4 ETH: Cost 20 000, Realized +4 000, Taxable gain —, Deferred in 5 000 'rolled over', pill 'Deferred'.
            A5 USDC: Cost 24 000, Realized 0, Taxable gain 9 000, Deferred in 9 000 'released', pill 'Taxable'.
            B2 SOL: Realized +200, Taxable gain 200, Deferred in —, pill 'Taxable'.
        - do: "Keep the default '|P&L| ≥ €1' filter."
          expect: "A5 is still listed (its taxable gain is 9 000)."

    - id: 5
      title: "Explain an entry (A4 and A5)"
      actions:
        - do: "In the Realized panel, click the ID of the A4 (ETH) row."
          expect: >
            'Realized entry' panel: Realized block 24 000 − 20 000 = 4 000; tax block
            24 000 − 15 000 = 9 000 'Tax view (not taxed now)'; 'Deferred in: 5 000 (rolled over)'
            with the explanation sentence; 1 lot consumed (cost 20 000, tax cost 15 000).
        - do: "Read the cost chain at the bottom."
          expect: "ETH lot (2 500, tax 1 875) → BTC lot (30 000) → EUR deposit (origin)."
        - do: "Open the A5 (USDC) entry the same way."
          expect: "Taxable gain 9 000 = Realized 0 + Deferred in 9 000 (released). Chain: USDC → ETH → BTC → EUR."

    - id: 6
      title: "Chain popover"
      actions:
        - do: "In the Realized panel, click the 🔗 cell of any row."
          expect: "The Cost Basis Chain popover opens above the panel and shows each step with cost (and tax cost when different)."

    # ── Lots ───────────────────────────────────────────────────
    - id: 7
      title: "Cost lots in both views"
      actions:
        - do: "Audit section → click the Cost Lots stat card."
          expect: "Columns include Rem Cost, Tax Cost and Deferred."
        - do: "Find the Cold Wallet ETH lot (8 ETH, acquired 2024-03-01)."
          expect: "Unit cost 2 500, Rem Cost 20 000, Tax Cost 15 000, Deferred 5 000. The transfer kept the acquisition date."
        - do: "Find the SOL lot."
          expect: "6 SOL, Rem Cost 600 = Tax Cost 600, Deferred —."

    # ── Units ──────────────────────────────────────────────────
    - id: 8
      title: "Unit panel"
      actions:
        - do: "In the Realized panel, click the Unit of the A4 row."
          expect: "Unit panel realized table: Cost 20 000, Realized 4 000, Taxable gain —, Deferred in 5 000 rolled over, pill 'Deferred'."
        - do: "Click the realized row in the Unit panel."
          expect: "The Realized entry panel opens on top of the Unit panel."

    # ── Audit transactions table ───────────────────────────────
    - id: 9
      title: "Audit transactions table layout"
      actions:
        - do: "Audit section, Transactions table. Scroll horizontally."
          expect: "Unit and Realized stay pinned on the right with a divider; Date/Time stays pinned on the left; month/day header rows span the full width."
        - do: "Open 'Columns' in the table header."
          expect: "A 'P&L' group lists Fees, Events (hidden by default), Unit, Realized."
        - do: "Hover the Realized header info icon and the day header 'Realized Σ'."
          expect: "Header: per-transaction value; day/month header: sum of the period."
        - do: "Read the A4 (2024-05-01) and A5 (2024-07-01) rows."
          expect: "A4 Realized +4 000 (tooltip lists Deferred in 5 000 rolled over). A5 Realized 0 with a 'Taxable: 9 000' line underneath."
        - do: "Click the A4 Realized value."
          expect: "The Realized entry panel opens for that entry."

    - id: 10
      title: "Locate a transaction (audit table)"
      actions:
        - do: "In the audit table, click 'Has P&L' to filter."
          expect: "Only A2, A4, A5, B2 remain; each row has a Locate action."
        - do: "Click Locate on the A4 row."
          expect: >
            Context bar 'Around TX #… (2024-04-28 → 2024-05-04) · all accounts and assets';
            the filter chips are greyed out; the May 2024 month and the 1 May day are expanded;
            the A4 row is highlighted and scrolled into view.
        - do: "Click '← Back to previous view'."
          expect: "The 'Has P&L' filter is restored and the full filtered list is back."

    # ── Transaction side panel ─────────────────────────────────
    - id: 11
      title: "Transaction P&L section"
      actions:
        - do: "Open the A4 transaction (click its row) and expand the P&L section."
          expect: >
            Calculation picker shows the latest version '(latest)'. Unit #… swap, role inflow/outflow.
            Realized: ETH +4 000, Deferred in 5 000 rolled over, pill 'Deferred'.
            Lots created: USDC 24 000, cost 24 000, tax cost 15 000. Lots consumed: 8 ETH, cost 20 000, tax cost 15 000.
        - do: "Click the realized row, then close it; click 'Locate in P&L audit'."
          expect: "The entry panel opens above the drawer. Locate opens the P&L page with the audit section open and the A4 row highlighted."
        - do: "Edit the transaction notes, reopen the P&L section."
          expect: "An 'Edited after this calculation' banner with a Recalculate button."
        - run: "curl -s localhost:8790/pnl/versions/1/transactions/6/impact | python3 -m json.tool | head -30"
          expect: "included true, unit_pattern swap, one realized entry (pnl 9000, economic 4000)."

    # ── Accounts ───────────────────────────────────────────────
    - id: 12
      title: "Account scope: net deposits"
      actions:
        - run: "curl -s 'localhost:8790/pnl/versions/1/metrics/book?account_ids=2' | python3 -m json.tool | grep net_deposits"
          expect: "Cold Wallet net_deposits 20000 (8 ETH received by transfer, at cost)."
        - do: "Drill into the Cold Wallet account on the P&L page."
          expect: "Cost card shows 'Net deposits: 20.0K €'."

    # ── Reconciliation ─────────────────────────────────────────
    - id: 13
      title: "Views reconcile"
      expected: >
        Realized 14 200 + Unrealized 4 300 = Taxable 9 200 + Taxable if sold now 9 300
        (ETH 24 000 − 15 000, SOL 900 − 600) = Total return 18 500.

    # ── Configuration variant ──────────────────────────────────
    - id: 14
      title: "Swaps configured as taxable: no divergence"
      actions:
        - run: "curl -s -X POST localhost:8790/pnl/calculate -H 'Content-Type: application/json' -d '{\"base_currency_symbol\": \"EUR\", \"crypto_swap_taxable_by_default\": true}'"
          expect: "New version created."
        - do: "Reload the P&L page."
          expect: >
            Realized 14 200 with Taxable 14 200 and no Deferred line. All four entries show the
            'Taxable' pill, Deferred in '—'. No 'Taxable if sold' line on any asset card.

    - id: 15
      title: "Tax reports unaffected"
      expected: >
        With default settings, the French crypto tax report and the Taxable totals match the
        previous release: tax reports read only the tax columns.
