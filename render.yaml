# Render Blueprint - trades-exporter
# https://render.com/docs/blueprint-spec
#
# This file configures automatic deployment to Render's free tier.
# Connect your GitHub repo and Render will deploy on each push to main.

services:
  # Backend API
  - type: web
    name: trades-exporter-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trades-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.12.0

  # Frontend (Static Site)
  - type: web
    name: trades-exporter-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend URL in Render dashboard

databases:
  - name: trades-db
    plan: free
    region: oregon
    postgresMajorVersion: 15
    ipAllowList: [] # Only allow connections from Render services
