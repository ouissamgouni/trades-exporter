services:
  postgres:
    image: postgres:16-alpine
    container_name: trades-exporter-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trades_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trades_password}
      POSTGRES_DB: ${POSTGRES_DB:-trades_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trades_user} -d ${POSTGRES_DB:-trades_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: trades-exporter-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trades_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trades_password}
      POSTGRES_DB: ${POSTGRES_DB_TEST:-trades_db_test}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trades_user} -d ${POSTGRES_DB_TEST:-trades_db_test}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
