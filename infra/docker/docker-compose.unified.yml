# Docker Compose - Unified Configuration (Test/Prod)
# Environment-agnostic service definitions
# Uses ENV_NAME and IMAGE_TAG from .env files
#
# Usage: 
#   Test:  docker compose -f docker-compose.unified.yml --env-file ../../.env.test up -d
#   Prod:  docker compose -f docker-compose.unified.yml --env-file ../../.env.prod up -d
#
# Or use task commands:
#   task start:test  # Uses .env + .env.test
#   task start:prod  # Uses .env + .env.prod

services:
  postgres:
    image: postgres:15-alpine
    container_name: trades_db_${ENV_NAME}
    env_file:
      - ../../.env
      - ../../.env.${ENV_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  backend:
    image: trades-exporter-backend:${IMAGE_TAG}
    container_name: trades_backend_${ENV_NAME}
    env_file:
      - ../../.env
      - ../../.env.${ENV_NAME}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT},http://frontend:80
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    image: trades-exporter-frontend:${IMAGE_TAG}
    container_name: trades_frontend_${ENV_NAME}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - app_network

volumes:
  postgres_data:
    name: trades_${ENV_NAME}_data

networks:
  app_network:
    name: trades_${ENV_NAME}_network
