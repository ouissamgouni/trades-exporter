# Docker Compose - Database only (dev + scenarios)
# Dev is a scenario named "dev" (pinned ports); every other scenario gets
# hash-derived ports. All config comes from the shell environment set by
# .taskfiles/scenario_ports.sh + .taskfiles/scenario_compose.sh.
#
# Usage (via Taskfile only):
#   task start:dev:db                       → trades_db_dev        (project trades-exporter-dev)
#   task start:scenario:db SCENARIO=fr_tax  → trades_db_scenario-fr_tax

services:
  postgres:
    image: postgres:15-alpine
    container_name: trades_db_${ENV_NAME}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: trades_${ENV_NAME}_data
