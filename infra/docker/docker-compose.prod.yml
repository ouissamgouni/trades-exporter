# Docker Compose - Production Environment
# Full containerized stack with tagged images
# Supports VERSION variable for deploying specific versions
#
# Usage: VERSION=v1.2.0 docker compose -f docker-compose.prod.yml up -d
#        or: task deploy:prod:local v1.2.0

services:
  postgres_prod:
    image: postgres:15-alpine
    container_name: trades_db_prod
    env_file:
      - ../../.env.prod
    ports:
      - "5434:5432"
    volumes:
      - trades_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prod_network

  backend_prod:
    image: trades-exporter-backend:${VERSION:-latest}
    container_name: trades_backend_prod
    env_file:
      - ../../.env.prod
    environment:
      DATABASE_URL: postgresql://${PROD_DB_USER}:${PROD_DB_PASSWORD}@postgres_prod:5432/${PROD_DB_NAME}
      CORS_ORIGINS: http://localhost:3000,http://frontend_prod:80
    ports:
      - "8080:8000"
    depends_on:
      postgres_prod:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - prod_network

  frontend_prod:
    image: trades-exporter-frontend:${VERSION:-latest}
    container_name: trades_frontend_prod
    ports:
      - "3000:80"
    depends_on:
      - backend_prod
    restart: unless-stopped
    networks:
      - prod_network

volumes:
  trades_prod_data:
    name: trades_prod_data

networks:
  prod_network:
    name: trades_prod_network
