# Docker Compose - Development Environment
# Only runs database, code runs locally with VSCode debugger
#
# Usage: docker compose -f docker-compose.dev.yml up -d
#        or: task start:dev

services:
  postgres_dev:
    image: postgres:15-alpine
    container_name: trades_db_${ENV_NAME}
    env_file:
      - ../../.env.dev
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - trades_${ENV_NAME}_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  trades_dev_data:
    name: trades_${ENV_NAME}_data
