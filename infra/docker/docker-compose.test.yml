# Docker Compose - Test Environment
# Full containerized stack from :develop tagged images
#
# Usage: docker compose -f docker-compose.test.yml up -d
#        or: task deploy:test:local

services:
  postgres_test:
    image: postgres:15-alpine
    container_name: trades_db_test
    env_file:
      - ../../.env.test
    ports:
      - "5433:5432"
    volumes:
      - trades_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - test_network

  backend_test:
    image: trades-exporter-backend:develop
    container_name: trades_backend_test
    env_file:
      - ../../.env.test
    environment:
      DATABASE_URL: postgresql://${TEST_DB_USER}:${TEST_DB_PASSWORD}@postgres_test:5432/${TEST_DB_NAME}
      CORS_ORIGINS: http://localhost:3001,http://frontend_test:80
    ports:
      - "8001:8000"
    depends_on:
      postgres_test:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - test_network

  frontend_test:
    image: trades-exporter-frontend:develop
    container_name: trades_frontend_test
    ports:
      - "3001:80"
    depends_on:
      - backend_test
    restart: unless-stopped
    networks:
      - test_network

volumes:
  trades_test_data:
    name: trades_test_data

networks:
  test_network:
    name: trades_test_network
