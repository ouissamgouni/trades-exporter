# https://taskfile.dev
version: "3"

# Note: Individual taskfiles override this with specific env files
# Common pattern: dotenv: [".env", ".env.dev"] for dev tasks
dotenv: [".env"]

vars:
  ROOT_DIR:
    sh: pwd
  BACKEND_DIR: ./backend
  FRONTEND_DIR: ./frontend
  WORKTREE_DIR: .worktrees
  WORKTREE_MAIN: .worktrees/main
  WORKTREE_DEVELOP: .worktrees/develop

includes:
  branch:
    taskfile: .taskfiles/branch.yml
    dir: "{{.ROOT_DIR}}"
  build:
    taskfile: .taskfiles/build.yml
    dir: "{{.ROOT_DIR}}"
  clean:
    taskfile: .taskfiles/clean.yml
    dir: "{{.ROOT_DIR}}"
  db:
    taskfile: .taskfiles/db.yml
    dir: "{{.ROOT_DIR}}"
  deploy:
    taskfile: .taskfiles/deploy.yml
    dir: "{{.ROOT_DIR}}"
  git:
    taskfile: .taskfiles/git.yml
    dir: "{{.ROOT_DIR}}"
  logs:
    taskfile: .taskfiles/logs.yml
    dir: "{{.ROOT_DIR}}"
  pr:
    taskfile: .taskfiles/pr.yml
    dir: "{{.ROOT_DIR}}"
  release:
    taskfile: .taskfiles/release.yml
    dir: "{{.ROOT_DIR}}"
  start:
    taskfile: .taskfiles/start.yml
    dir: "{{.ROOT_DIR}}"
  stop:
    taskfile: .taskfiles/stop.yml
    dir: "{{.ROOT_DIR}}"
  test:
    taskfile: .taskfiles/test.yml
    dir: "{{.ROOT_DIR}}"
  worktree:
    taskfile: .taskfiles/worktree.yml
    dir: "{{.ROOT_DIR}}"
  qa:
    taskfile: .taskfiles/qa.yml
    dir: "{{.ROOT_DIR}}"

tasks:
  install:
    desc: Install all dependencies
    cmds:
      - |
        echo "Installing backend dependencies..."
        cd {{.BACKEND_DIR}} && .venv/bin/pip install -r requirements.txt
        echo ""
        echo "Installing frontend dependencies..."
        cd {{.FRONTEND_DIR}} && npm install
        echo ""
        echo "✅ All dependencies installed"

  status:
    desc: Show all running containers
    cmds:
      - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  default:
    cmds:
      - task: help

  help:
    desc: Show categorized help
    cmds:
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "                    TRADES-EXPORTER TASKS"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        echo "BRANCHING"
        echo "  task branch:feature -- <name>   Create feature branch from develop"
        echo "  task branch:fix -- <name>       Create fix branch from develop"
        echo "  task branch:hotfix -- <name>    Create hotfix branch from main"
        echo ""
        echo "DEVELOPMENT"
        echo "  task start:dev          Start dev DB"
        echo "  task start:dev:debug    Start DB + backend + frontend (debug)"
        echo "  task stop:dev           Stop dev services"
        echo ""
        echo "TESTING"
        echo "  task test               Run unit tests"
        echo "  task test:int:local     Integration tests (trades_db_integ)"
        echo "  task test:int:dev       Integration tests (dev)"
        echo "  task deploy:test:local  Deploy to test stack"
        echo ""
        echo "QA ENVIRONMENT"
        echo "  task qa:spin -- <ref>   Build + deploy isolated QA from git ref"
        echo "  task qa:spin:current    Build + deploy QA from working directory"
        echo "  task qa:spin:dev        QA with local code + live reload"
        echo "  task qa:stop            Stop + cleanup QA (containers + DB)"
        echo ""
        echo "PRODUCTION"
        echo "  task release:tag v1.0   Tag release"
        echo "  task deploy:prod:local  Deploy to local prod"
        echo ""
        echo "Run 'task --list' for all commands"
        echo "═══════════════════════════════════════════════════════════════"
