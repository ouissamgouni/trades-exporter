# https://taskfile.dev
version: "3"

vars:
  BACKEND_DIR: ./backend
  FRONTEND_DIR: ./frontend

  # Port configuration
  DEV_DB_PORT: 5432
  DEV_BACKEND_PORT: 8000
  DEV_FRONTEND_PORT: 5173
  DEV_DEBUGPY_PORT: 5678

  TEST_DB_PORT: 5433
  TEST_BACKEND_PORT: 8001
  TEST_FRONTEND_PORT: 3001

  PROD_DB_PORT: 5434
  PROD_BACKEND_PORT: 8080
  PROD_FRONTEND_PORT: 3000

includes:
  build: .taskfiles/build.yml
  clean: .taskfiles/clean.yml
  db: .taskfiles/db.yml
  deploy: .taskfiles/deploy.yml
  logs: .taskfiles/logs.yml
  pr: .taskfiles/pr.yml
  release: .taskfiles/release.yml
  start: .taskfiles/start.yml
  stop: .taskfiles/stop.yml
  test: .taskfiles/test.yml

tasks:
  feature:
    desc: Create a new feature branch from develop
    cmds:
      - |
        NAME={{.CLI_ARGS}}
        if [ -z "$NAME" ]; then
          echo "❌ Usage: task feature <name>"
          exit 1
        fi
        git checkout develop
        git pull origin develop
        git checkout -b feature/$NAME
        echo "✅ Created branch: feature/$NAME"

  fix:
    desc: Create a new fix branch from develop
    cmds:
      - |
        NAME={{.CLI_ARGS}}
        if [ -z "$NAME" ]; then
          echo "❌ Usage: task fix <name>"
          exit 1
        fi
        git checkout develop
        git pull origin develop
        git checkout -b fix/$NAME
        echo "✅ Created branch: fix/$NAME"

  hotfix:
    desc: Create a hotfix branch from main
    cmds:
      - |
        NAME={{.CLI_ARGS}}
        if [ -z "$NAME" ]; then
          echo "❌ Usage: task hotfix <name>"
          exit 1
        fi
        git checkout main
        git pull origin main
        git checkout -b hotfix/$NAME
        echo "✅ Created branch: hotfix/$NAME"

  install:
    desc: Install all dependencies
    cmds:
      - |
        echo "Installing backend dependencies..."
        cd {{.BACKEND_DIR}} && .venv/bin/pip install -r requirements.txt
        echo ""
        echo "Installing frontend dependencies..."
        cd {{.FRONTEND_DIR}} && npm install
        echo ""
        echo "✅ All dependencies installed"

  status:
    desc: Show all running containers
    cmds:
      - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  default:
    cmds:
      - task: help

  help:
    desc: Show categorized help
    cmds:
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "                    TRADES-EXPORTER TASKS"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        echo "BRANCHING"
        echo "  task feature <name>     Create feature branch"
        echo "  task fix <name>         Create fix branch"
        echo "  task hotfix <name>      Create hotfix branch"
        echo ""
        echo "DEVELOPMENT"
        echo "  task start:dev          Start dev DB"
        echo "  task start:dev:debug    Start DB + backend + frontend (debug)"
        echo "  task stop:dev           Stop dev services"
        echo ""
        echo "TESTING"
        echo "  task test               Run unit tests"
        echo "  task test:int:dev       Integration tests (dev)"
        echo "  task deploy:test:local  Deploy to test stack"
        echo ""
        echo "PRODUCTION"
        echo "  task release:tag v1.0   Tag release"
        echo "  task deploy:prod:local  Deploy to local prod"
        echo ""
        echo "Run 'task --list' for all commands"
        echo "═══════════════════════════════════════════════════════════════"
