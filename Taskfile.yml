# https://taskfile.dev
version: "3"

dotenv: ["config/base.env"]

vars:
  ROOT_DIR:
    sh: pwd
  BACKEND_DIR: ./backend
  FRONTEND_DIR: ./frontend
  WORKTREE_DIR: .worktrees
  WORKTREE_MAIN: .worktrees/main
  WORKTREE_DEVELOP: .worktrees/develop
  SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh

includes:
  build:
    taskfile: .taskfiles/build.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  db:
    taskfile: .taskfiles/db.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      BACKEND_DIR: "{{.BACKEND_DIR}}"
  deploy:
    taskfile: .taskfiles/deploy.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  git:
    taskfile: .taskfiles/git.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      WORKTREE_DIR: "{{.WORKTREE_DIR}}"
      WORKTREE_MAIN: "{{.WORKTREE_MAIN}}"
      WORKTREE_DEVELOP: "{{.WORKTREE_DEVELOP}}"
  logs:
    taskfile: .taskfiles/logs.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  release:
    taskfile: .taskfiles/release.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      WORKTREE_DIR: "{{.WORKTREE_DIR}}"
      WORKTREE_MAIN: "{{.WORKTREE_MAIN}}"
      WORKTREE_DEVELOP: "{{.WORKTREE_DEVELOP}}"
  open:
    taskfile: .taskfiles/open.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  start:
    taskfile: .taskfiles/start.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      BACKEND_DIR: "{{.BACKEND_DIR}}"
      FRONTEND_DIR: "{{.FRONTEND_DIR}}"
  stop:
    taskfile: .taskfiles/stop.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  test:
    taskfile: .taskfiles/test.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      BACKEND_DIR: "{{.BACKEND_DIR}}"
      FRONTEND_DIR: "{{.FRONTEND_DIR}}"

tasks:
  install:
    desc: Install all dependencies (backend + frontend)
    cmds:
      - task: install:backend
      - task: install:frontend

  install:backend:
    desc: Install backend Python dependencies
    dir: "{{.ROOT_DIR}}"
    cmds:
      - .venv/bin/pip install -r backend/requirements.txt
    sources:
      - backend/requirements.txt

  install:frontend:
    desc: Install frontend Node dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install
    sources:
      - package.json

  status:
    desc: Show all running containers across all environments
    cmds:
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "  Environment Status"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        docker ps --filter "name=trades_" --format 'table {{`{{.Names}}`}}\t{{`{{.Status}}`}}\t{{`{{.Ports}}`}}' 2>/dev/null || echo "  No containers running"
        echo ""

  scenarios:
    desc: List all scenarios with hash-based ports, seed data, and running status
    cmds:
      - |
        SCENARIOS_DIR="{{.ROOT_DIR}}/scenarios"

        echo "═══════════════════════════════════════════════════════════════"
        echo "  Scenarios"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "Name" "Offset" "DB" "API" "WEB" "Status"
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "──────────────────────────────────" "──────" "─────" "─────" "─────" "──────────"

        # Collect running scenario containers (Docker mode)
        RUNNING_DOCKER=$(docker ps --filter "name=trades_db_scenario-" --format '{{`{{.Names}}`}}' 2>/dev/null || true)

        # Track offsets for collision detection
        ALL_OFFSETS=""

        # ── Default scenario (always offset 0) ──
        STATUS="—"
        if echo "$RUNNING_DOCKER" | grep -qx "trades_db_scenario-default" 2>/dev/null; then
          STATUS="🟢 docker"
        elif lsof -iTCP:8002 -sTCP:LISTEN >/dev/null 2>&1; then
          STATUS="🟢 local"
        fi
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "default" "0" "5435" "8002" "3002" "$STATUS"

        # ── Dev scenario (pinned ports) ──
        STATUS="—"
        if docker ps --filter "name=^/trades_db_dev$" --format '{{`{{.Names}}`}}' 2>/dev/null | grep -q .; then
          STATUS="🟢 db"
          lsof -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1 && STATUS="🟢 local"
        fi
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "dev" "pinned" "5432" "8000" "5173" "$STATUS"

        # ── Named scenarios from seed directories ──
        if [ -d "$SCENARIOS_DIR" ]; then
          for DIR in "$SCENARIOS_DIR"/*/; do
            [ -d "$DIR" ] || continue
            NAME=$(basename "$DIR")
            [ "$NAME" = "default" ] && continue
            [ "$NAME" = "dev" ] && continue

            # Hash-based offset: cksum of name mod 9999 + 1
            OFFSET=$(printf '%s' "$NAME" | cksum | awk '{print ($1 % 9999) + 1}')
            DB=$((5435 + OFFSET))
            API=$((8002 + OFFSET))
            WEB=$((3002 + OFFSET))

            # Check running status
            STATUS="—"
            DB_CONTAINER="trades_db_scenario-${NAME}"
            if echo "$RUNNING_DOCKER" | grep -qx "$DB_CONTAINER" 2>/dev/null; then
              STATUS="🟢 docker"
            elif lsof -iTCP:"$API" -sTCP:LISTEN >/dev/null 2>&1; then
              STATUS="🟢 local"
            fi

            printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "$NAME" "$OFFSET" "$DB" "$API" "$WEB" "$STATUS"

            # Track for collision detection
            ALL_OFFSETS="$ALL_OFFSETS $OFFSET:$NAME"
          done
        fi

        # ── Collision detection ──
        COLLISIONS=$(echo "$ALL_OFFSETS" | tr ' ' '\n' | sort | awk -F: 'NF{a[$1]=a[$1]" "$2} END{for(k in a){n=split(a[k],b," "); if(n>1) print k": "a[k]}}')
        if [ -n "$COLLISIONS" ]; then
          echo ""
          echo "  ⚠️  Hash collisions detected (use PORT_OFFSET=N to resolve):"
          echo "$COLLISIONS" | while IFS= read -r line; do
            echo "    Offset $line"
          done
        fi

        echo ""
        echo "Ports are derived from scenario name hash (deterministic)."
        echo "Override with PORT_OFFSET=N for custom offset."
        echo ""
        echo "Usage:"
        echo "  task start:scenario SCENARIO=fr_tax"
        echo "  task start:scenario:ref -- feature/branch SCENARIO=fr_tax"
        echo "  task start:scenario SCENARIO=custom PORT_OFFSET=42"
        echo "  task scenarios                                          # ← this list"
        echo "═══════════════════════════════════════════════════════════════"

  default:
    desc: Show help
    cmds:
      - task: help

  script:
    desc:
      "Run any backend script with an env's config. ENV=dev|staging:local|prod:local|scenario
      (default dev), YES=1 skips the prod prompt. Usage: task script ENV=prod:local -- <script> [args...]"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    silent: true
    vars:
      ENV: '{{.ENV | default "dev"}}'
      YES: '{{.YES | default "0"}}'
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ $# -eq 0 ]; then
          echo "Usage: task script [ENV=dev|staging:local|prod:local|scenario] [YES=1] -- <script> [args...]"
          echo "Scripts:"
          for f in backend/scripts/*.py; do
            n=$(basename "$f" .py)
            [ "$n" = "__init__" ] || echo "  $n"
          done
          exit 0
        fi
        case "{{.ENV}}" in
          dev) FILES="config/base.env scenarios/dev/config.env config/secrets.env config/secrets.dev.env" ;;
          staging:local) FILES="config/base.env config/staging.local.env config/secrets.env config/secrets.staging.local.env" ;;
          prod:local) FILES="config/base.env config/prod.local.env config/secrets.env config/secrets.prod.local.env" ;;
          scenario) FILES="config/base.env config/scenario.env config/secrets.env config/secrets.scenario.env" ;;
          *) echo "❌ Unknown ENV '{{.ENV}}' — use dev | staging:local | prod:local | scenario"; exit 1 ;;
        esac
        for f in $FILES; do
          # secrets files are optional (gitignored)
          [ -f "$f" ] || continue
          # Parsed, not sourced: unquoted values like `...?a=b&c=d` break `. file`.
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line#export }
            case "$line" in ''|\#*) continue ;; *=*) ;; *) continue ;; esac
            key=${line%%=*}
            val=${line#*=}
            case "$val" in
              \"*\") val=${val#\"}; val=${val%\"} ;;
              \'*\') val=${val#\'}; val=${val%\'} ;;
            esac
            export "$key=$val"
          done < "$f"
        done
        if [ "{{.ENV}}" = "scenario" ]; then
          source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
          export POSTGRES_PORT=$SC_DB_PORT POSTGRES_DB=$SC_DB_NAME
        fi
        [ -n "$DATABASE_URL" ] || export DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB"
        MODULE=$(echo "$1" | sed -e 's/\.py$//' -e 's#/#.#g')
        case "$MODULE" in
          *.*) ;;
          *) MODULE="backend.scripts.$MODULE" ;;
        esac
        shift
        echo "DB: $(echo "$DATABASE_URL" | sed 's/:[^:@]*@/@/')"
        if [ "{{.ENV}}" = "prod:local" ] && [ "{{.YES}}" != "1" ]; then
          printf "⚠️  Run %s %s against PRODUCTION? Type 'prod' to continue: " "$MODULE" "$*"
          read -r ANSWER
          if [ "$ANSWER" != "prod" ]; then
            echo "Aborted."
            exit 1
          fi
        fi
        echo "▶ [{{.ENV}}] python -m $MODULE $*"
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/python -m "$MODULE" "$@"

  help:
    desc: Show categorized help
    cmds:
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "                    TRADETRAIL TASKS"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        echo "BRANCHING"
        echo "  task git:feature -- <name>      Create feature branch from develop"
        echo "  task git:fix -- <name>          Create fix branch from develop"
        echo "  task git:hotfix -- <name>       Create hotfix branch from main"
        echo ""
        echo "PULL REQUESTS"
        echo "  task git:pr -- <title>          Push + create draft PR"
        echo "  task git:pr:publish -- <title>  Push + create ready PR"
        echo "  task git:pr:ready              Mark draft PR as ready"
        echo "  task git:pr:merge              Merge current PR"
        echo "  task git:pr:view               Open PR in browser"
        echo "  task git:pr:checks             Show PR check status"
        echo ""
        echo "DEVELOPMENT"
        echo "  task start:dev                  Start full dev stack (DB + API + Web)"
        echo "  task start:dev:debug            Start full dev stack with debugger"
        echo "  task start:dev:db               Start dev database only"
        echo "  task open:shared:dev            Focus/open dev in default Chrome"
        echo "  task open:isolated:dev          Open isolated dev browser session"
        echo "  task stop:dev                   Stop all dev services"
        echo ""
        echo "TESTING"
        echo "  task test                       Run unit tests (quick)"
        echo "  task test:backend                Run all backend tests (unit+int+e2e)"
        echo "  task test:frontend               Run all frontend tests (unit+e2e smoke)"
        echo "  task test:frontend:e2e          Frontend Playwright smoke tests"
        echo "  task test:backend:e2e           Backend e2e tests (self-contained)"
        echo "  task test:backend:int           Integration tests (self-contained scenario DB)"
        echo "  task test:backend:int:teardown  Integration tests + scenario teardown"
        echo "  task test:e2e                    Full-stack e2e (db + backend + frontend)"
        echo "  task test:all                    Run the full test suite (backend+frontend+e2e)"
        echo ""
        echo "DATABASE"
        echo "  task db:migrate                 Run migrations (dev)"
        echo "  task db:seed                    Seed database (dev)"
        echo "  task db:reset                   Reset database (dev) ⚠️"
        echo "  task db:status:dev              Migration status"
        echo "  task db:copy -- dev prod        Copy a DB between envs (dev|staging|prod|scenario)"
        echo "  task script ENV=prod:local -- <script> [args]   Run backend/scripts/<script>"
        echo ""
        echo "STAGING (local docker-compose)"
        echo "  task deploy:staging:local       Build from develop + deploy local staging"
        echo "  task deploy:staging:local:cwd   Deploy local staging from working directory"
        echo "  task deploy:staging:status      Deployed SHA vs origin/develop"
        echo "  task start:staging:local        Start local staging (existing images)"
        echo "  task stop:staging:local         Stop local staging stack"
        echo ""
        echo "SCENARIO (Isolated QA)"
        echo "  task start:scenario              Local code + Docker DB + live reload"
        echo "  task start:scenario:db           DB only (portable fixture for tests/CI)"
        echo "  task start:scenario:backend      DB + backend only, detached (Playwright/CI)"
        echo "  task start:scenario:ref -- <ref>  Build + deploy scenario from git ref"
        echo "  task stop:scenario               Stop scenario instance"
        echo "  task stop:scenario:all           Stop all scenario instances"
        echo ""
        echo "PRODUCTION (local docker-compose, per-component releases)"
        echo "  task release:prod:backend  -- v1.2.0   Tag backend-v1.2.0 + deploy"
        echo "  task release:prod:frontend -- v1.2.0   Tag frontend-v1.2.0 + deploy"
        echo "  task release:prod:db       -- v1.2.0   Tag db-v1.2.0 + migrate"
        echo "  task release:prod                      Aggregate: prompts per component"
        echo "  task release:prod -- --fast            Changed components + suggested tags, one confirm"
        echo "  task release:prod -- --dry-run         Show the --fast plan only"
        echo "  task deploy:prod:local:backend -- backend-v1.2.0   Deploy only"
        echo "  task deploy:prod:local:cwd             Deploy working directory (all components)"
        echo "  task deploy:prod:status[:<component>][:diff]       Released vs deployed (drift)"
        echo "  task git:release:prepare               Check develop is ahead of main"
        echo "  task start:prod:local                  Start local prod (deployed images)"
        echo ""
        echo "UTILITIES"
        echo "  task status                     Show all running containers"
        echo "  task logs:dev                   Tail dev logs"
        echo "  task logs:staging:local         Tail local staging logs"
        echo "  task logs:prod:local            Tail local prod logs"
        echo "  task db:reset:dev               Reset dev database"
        echo ""
        echo "Run 'task --list' for all commands"
        echo "═══════════════════════════════════════════════════════════════"
