# https://taskfile.dev
version: "3"

dotenv: ["config/base.env"]

vars:
  ROOT_DIR:
    sh: pwd
  BACKEND_DIR: "{{.ROOT_DIR}}/backend"
  FRONTEND_DIR: "{{.ROOT_DIR}}/frontend"
  WORKTREE_DIR: .worktrees
  WORKTREE_MAIN: .worktrees/main
  WORKTREE_DEVELOP: .worktrees/develop
  SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh

includes:
  build:
    taskfile: .taskfiles/build.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  db:
    taskfile: .taskfiles/db.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      BACKEND_DIR: "{{.BACKEND_DIR}}"
  deploy:
    taskfile: .taskfiles/deploy.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  git:
    taskfile: .taskfiles/git.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      WORKTREE_DIR: "{{.WORKTREE_DIR}}"
      WORKTREE_MAIN: "{{.WORKTREE_MAIN}}"
      WORKTREE_DEVELOP: "{{.WORKTREE_DEVELOP}}"
  logs:
    taskfile: .taskfiles/logs.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  release:
    taskfile: .taskfiles/release.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      WORKTREE_DIR: "{{.WORKTREE_DIR}}"
      WORKTREE_MAIN: "{{.WORKTREE_MAIN}}"
      WORKTREE_DEVELOP: "{{.WORKTREE_DEVELOP}}"
  open:
    taskfile: .taskfiles/open.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  start:
    taskfile: .taskfiles/start.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      BACKEND_DIR: "{{.BACKEND_DIR}}"
      FRONTEND_DIR: "{{.FRONTEND_DIR}}"
  stop:
    taskfile: .taskfiles/stop.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
  test:
    taskfile: .taskfiles/test.yml
    dir: "{{.ROOT_DIR}}"
    vars:
      ROOT_DIR: "{{.ROOT_DIR}}"
      BACKEND_DIR: "{{.BACKEND_DIR}}"
      FRONTEND_DIR: "{{.FRONTEND_DIR}}"

tasks:
  install:
    desc: Install all dependencies (backend + frontend)
    cmds:
      - task: install:backend
      - task: install:frontend

  install:backend:
    desc: Install backend Python dependencies
    dir: "{{.ROOT_DIR}}"
    cmds:
      - .venv/bin/pip install -r backend/requirements.txt
    sources:
      - backend/requirements.txt

  install:frontend:
    desc: Install frontend Node dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install
    sources:
      - package.json

  status:
    desc: Show all running containers across all environments
    cmds:
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "  Environment Status"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        docker ps --filter "name=trades_" --format 'table {{`{{.Names}}`}}\t{{`{{.Status}}`}}\t{{`{{.Ports}}`}}' 2>/dev/null || echo "  No containers running"
        echo ""

  scenarios:
    desc: List all scenarios with hash-based ports, seed data, and running status
    cmds:
      - |
        SCENARIOS_DIR="{{.ROOT_DIR}}/scenarios"

        echo "═══════════════════════════════════════════════════════════════"
        echo "  Scenarios"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "Name" "Offset" "DB" "API" "WEB" "Status"
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "──────────────────────────────────" "──────" "─────" "─────" "─────" "──────────"

        # Collect running scenario containers (Docker mode)
        RUNNING_DOCKER=$(docker ps --filter "name=trades_db_scenario-" --format '{{`{{.Names}}`}}' 2>/dev/null || true)

        # Track offsets for collision detection
        ALL_OFFSETS=""

        # ── Default scenario (always offset 0) ──
        STATUS="—"
        if echo "$RUNNING_DOCKER" | grep -qx "trades_db_scenario-default" 2>/dev/null; then
          STATUS="🟢 docker"
        elif lsof -iTCP:8002 -sTCP:LISTEN >/dev/null 2>&1; then
          STATUS="🟢 local"
        fi
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "default" "0" "5435" "8002" "3002" "$STATUS"

        # ── Dev scenario (pinned ports) ──
        STATUS="—"
        if docker ps --filter "name=^/trades_db_dev$" --format '{{`{{.Names}}`}}' 2>/dev/null | grep -q .; then
          STATUS="🟢 db"
          lsof -iTCP:8000 -sTCP:LISTEN >/dev/null 2>&1 && STATUS="🟢 local"
        fi
        printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "dev" "pinned" "5432" "8000" "5173" "$STATUS"

        # ── Named scenarios from seed directories ──
        if [ -d "$SCENARIOS_DIR" ]; then
          for DIR in "$SCENARIOS_DIR"/*/; do
            [ -d "$DIR" ] || continue
            NAME=$(basename "$DIR")
            [ "$NAME" = "default" ] && continue
            [ "$NAME" = "dev" ] && continue

            # Hash-based offset: cksum of name mod 9999 + 1
            OFFSET=$(printf '%s' "$NAME" | cksum | awk '{print ($1 % 9999) + 1}')
            DB=$((5435 + OFFSET))
            API=$((8002 + OFFSET))
            WEB=$((3002 + OFFSET))

            # Check running status
            STATUS="—"
            DB_CONTAINER="trades_db_scenario-${NAME}"
            if echo "$RUNNING_DOCKER" | grep -qx "$DB_CONTAINER" 2>/dev/null; then
              STATUS="🟢 docker"
            elif lsof -iTCP:"$API" -sTCP:LISTEN >/dev/null 2>&1; then
              STATUS="🟢 local"
            fi

            printf "  %-34s  %6s  %-5s  %-5s  %-5s  %s\n" "$NAME" "$OFFSET" "$DB" "$API" "$WEB" "$STATUS"

            # Track for collision detection
            ALL_OFFSETS="$ALL_OFFSETS $OFFSET:$NAME"
          done
        fi

        # ── Collision detection ──
        COLLISIONS=$(echo "$ALL_OFFSETS" | tr ' ' '\n' | sort | awk -F: 'NF{a[$1]=a[$1]" "$2} END{for(k in a){n=split(a[k],b," "); if(n>1) print k": "a[k]}}')
        if [ -n "$COLLISIONS" ]; then
          echo ""
          echo "  ⚠️  Hash collisions detected (use PORT_OFFSET=N to resolve):"
          echo "$COLLISIONS" | while IFS= read -r line; do
            echo "    Offset $line"
          done
        fi

        echo ""
        echo "Ports are derived from scenario name hash (deterministic)."
        echo "Override with PORT_OFFSET=N for custom offset."
        echo ""
        echo "Usage:"
        echo "  task start:scenario SCENARIO=fr_tax"
        echo "  task start:scenario:ref -- feature/branch SCENARIO=fr_tax"
        echo "  task start:scenario SCENARIO=custom PORT_OFFSET=42"
        echo "  task scenarios                                          # ← this list"
        echo "═══════════════════════════════════════════════════════════════"

  default:
    desc: Show help
    cmds:
      - task: help

  script:
    desc:
      "Run any backend script with an env's config. ENV=dev|staging:local|prod:local|scenario
      (default dev), YES=1 skips the prod prompt. Usage: task script ENV=prod:local -- <script> [args...]"
    dir: "{{.ROOT_DIR}}"
    interactive: true
    silent: true
    vars:
      ENV: '{{.ENV | default "dev"}}'
      YES: '{{.YES | default "0"}}'
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ $# -eq 0 ]; then
          echo "Usage: task script [ENV=dev|staging:local|prod:local|scenario] [YES=1] -- <script> [args...]"
          echo "Scripts:"
          for f in backend/scripts/*.py; do
            n=$(basename "$f" .py)
            [ "$n" = "__init__" ] || echo "  $n"
          done
          exit 0
        fi
        case "{{.ENV}}" in
          dev) FILES="config/base.env scenarios/dev/config.env config/secrets.env config/secrets.dev.env" ;;
          staging:local) FILES="config/base.env config/staging.local.env config/secrets.env config/secrets.staging.local.env" ;;
          prod:local) FILES="config/base.env config/prod.local.env config/secrets.env config/secrets.prod.local.env" ;;
          scenario) FILES="config/base.env config/scenario.env config/secrets.env config/secrets.scenario.env" ;;
          *) echo "❌ Unknown ENV '{{.ENV}}' — use dev | staging:local | prod:local | scenario"; exit 1 ;;
        esac
        for f in $FILES; do
          # secrets files are optional (gitignored)
          [ -f "$f" ] || continue
          # Parsed, not sourced: unquoted values like `...?a=b&c=d` break `. file`.
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line#export }
            case "$line" in ''|\#*) continue ;; *=*) ;; *) continue ;; esac
            key=${line%%=*}
            val=${line#*=}
            case "$val" in
              \"*\") val=${val#\"}; val=${val%\"} ;;
              \'*\') val=${val#\'}; val=${val%\'} ;;
            esac
            export "$key=$val"
          done < "$f"
        done
        if [ "{{.ENV}}" = "scenario" ]; then
          source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
          export POSTGRES_PORT=$SC_DB_PORT POSTGRES_DB=$SC_DB_NAME
        fi
        [ -n "$DATABASE_URL" ] || export DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB"
        MODULE=$(echo "$1" | sed -e 's/\.py$//' -e 's#/#.#g')
        case "$MODULE" in
          *.*) ;;
          *) MODULE="backend.scripts.$MODULE" ;;
        esac
        shift
        echo "DB: $(echo "$DATABASE_URL" | sed 's/:[^:@]*@/@/')"
        if [ "{{.ENV}}" = "prod:local" ] && [ "{{.YES}}" != "1" ]; then
          printf "⚠️  Run %s %s against PRODUCTION? Type 'prod' to continue: " "$MODULE" "$*"
          read -r ANSWER
          if [ "$ANSWER" != "prod" ]; then
            echo "Aborted."
            exit 1
          fi
        fi
        echo "▶ [{{.ENV}}] python -m $MODULE $*"
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/python -m "$MODULE" "$@"

  help:
    desc: Show quick reference of available commands
    cmds:
      - |
        echo "═══════════════════════════════════════════════════════════════"
        echo "  TradeTrail — Task Commands"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
        echo "  ── Development ──────────────────────────────────────────"
        echo "  task start:dev              Start full dev (DB + API + Web)"
        echo "  task start:dev:debug        Start with debugger (port 5678)"
        echo "  task start:dev:db           Start database only"
        echo "  task stop:dev               Stop all dev services"
        echo "  task status                 Show running containers"
        echo ""
        echo "  ── Database ─────────────────────────────────────────────"
        echo "  task db:migrate             Run migrations (dev)"
        echo "  task db:seed                Seed database (dev)"
        echo "  task db:reset               Reset database (dev) ⚠️"
        echo "  task db:status:dev          Migration status"
        echo "  task db:check:prod          Connectivity + migration state (local prod)"
        echo "  task db:copy -- dev prod    Copy a DB between envs (dev|staging|prod|scenario)"
        echo "  task script ENV=prod:local -- <script> [args]   Run backend/scripts/<script> (ENV=dev|staging:local|prod:local|scenario)"
        echo ""
        echo "  ── Testing ──────────────────────────────────────────────"
        echo "  task test                   Quick unit tests"
        echo "  task test:unit:backend      Backend tests only"
        echo "  task test:unit:frontend     Frontend type check + build"
        echo "  task test:int               Integration tests (self-contained scenario DB)"
        echo "  task test:e2e               Full-stack e2e (db + backend + frontend)"
        echo "  task test:all               All tests (backend + frontend + e2e)"
        echo "  task test:ci                Simulate CI locally (act)"
        echo ""
        echo "  ── Git Workflow ─────────────────────────────────────────"
        echo "  task git:feature -- <name>  Create feature branch"
        echo "  task git:fix -- <name>      Create fix branch"
        echo "  task git:hotfix -- <name>   Create hotfix branch"
        echo "  task git:pr                 Push + create draft PR"
        echo "  task git:pr:ready           Mark PR ready for review"
        echo "  task git:pr:merge           Merge PR (squash)"
        echo "  task git:release:prepare    Release PR develop → main"
        echo "  task git:release:merge      Merge the release PR"
        echo ""
        echo "  ── Staging (local docker-compose) ───────────────────────"
        echo "  task deploy:staging:local                   Changed components from origin/develop"
        echo "  task deploy:staging:local -- <ref> --all    All components from a develop ref"
        echo "  task deploy:staging:local -- --dry-run      Show the plan only"
        echo "  task deploy:staging:local:ref -- <ref>      Quick full rebuild from ANY ref"
        echo "  task deploy:staging:local:cwd[:<component>] Deploy the working directory"
        echo "  task stop:staging:local                     Stop staging stack"
        echo ""
        echo "  ── Scenario ─────────────────────────────────────────────"
        echo "  task start:scenario         Local code + Docker DB"
        echo "  task start:scenario:ref -- <ref>   Build + deploy scenario from git ref"
        echo "  task stop:scenario          Stop scenario instance"
        echo "  task scenarios              List all scenario ports"
        echo "  ── Browser ──────────────────────────────────────────────"
        echo "  Add to start:* tasks:  BROWSER=none|shared|isolated   COUNT=N   RESET_BROWSER=1"
        echo "    none      (default for start:*)  servers only, no browser opened"
        echo "    shared    focus existing tab in your default Chrome (shared cookies)"
        echo "    isolated  open COUNT sessions, each with own --user-data-dir;"
        echo "              idempotent (focuses existing). RESET_BROWSER=1 wipes first."
        echo "  task open:shared:<env>               Focus/open one tab in default Chrome"
        echo "  task open:isolated:<env> [COUNT=N]   Open N isolated sessions"
        echo "    <env> = dev | scenario | staging:local | prod"
        echo "    e.g. task open:isolated:scenario SCENARIO=fr_tax COUNT=2"
        echo "  task open:clean             Remove all isolated Chrome profile dirs"
        echo "  task open:clean:dev         Remove only dev-* isolated profile dirs"
        echo ""
        echo "  ── Production (local, per-component releases) ──────────"
        echo "  task release:prod:backend  -- v1.2.0   Tag backend-v1.2.0 + deploy"
        echo "  task release:prod:frontend -- v1.2.0   Tag frontend-v1.2.0 + deploy"
        echo "  task release:prod:db       -- v1.2.0   Tag db-v1.2.0 + migrate"
        echo "  task release:prod:backend              Interactive (suggests next patch)"
        echo "  task release:prod                      Aggregate: prompts per component"
        echo "  task release:prod -- --fast            Changed components + suggested tags, one confirm"
        echo "  task release:prod -- --dry-run         Show the --fast plan only"
        echo "  task deploy:prod:local:backend -- backend-v1.2.0   Deploy only"
        echo "  task deploy:prod:local:cwd[:<component>]           Deploy the working directory"
        echo "  task deploy:prod:status                Released vs deployed (drift)"
        echo "  task deploy:prod:status:diff           All components commits/files vs origin/main"
        echo "  task deploy:prod:status:backend        Status for backend only"
        echo "  task deploy:prod:status:backend:diff   Backend commits/files vs origin/main"
        echo "  task deploy:prod:status:frontend       Status for frontend only"
        echo "  task deploy:prod:status:frontend:diff  Frontend commits/files vs origin/main"
        echo "  task deploy:prod:status:db             Status for DB only"
        echo "  task deploy:prod:status:db:diff        DB commits/files vs origin/main"
        echo "  task deploy:staging:status             Same for staging"
        echo "  task deploy:prod:current               Current prod backend tag"
        echo "  task start:prod:local / stop:prod      Start/stop local prod (deployed images)"
        echo "  task logs:prod                         Tail local prod logs"
        echo ""
        echo "  ── Build ────────────────────────────────────────────────"
        echo "  task build:staging          Build images from develop"
        echo "  task build:prod -- v1.0.0   Build images from main"
        echo "  task build:cwd              Build from working directory"
        echo "  task build:list             List Docker images"
        echo ""
        echo "  ── Safety ───────────────────────────────────────────────"
        echo "  DRY_RUN=1 task <cmd>        Preview without executing"
        echo "═══════════════════════════════════════════════════════════════"
