# Cloudflare Pages configuration for the trades-exporter frontend (React SPA)
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/
#
# NOTE: Pages does NOT support [build] in wrangler.toml (that is Workers-only).
# Build command, NODE_VERSION, and all VITE_* environment variables must be
# configured in the Cloudflare dashboard:
#
#   Pages → trades-exporter → Settings → Builds & deployments
#     • Build command:        cd frontend && npm ci && npm run build
#     • Build output dir:     frontend/dist
#
#   Pages → trades-exporter → Settings → Environment variables
#     Production:
#       NODE_VERSION = 22
#       VITE_API_URL = https://trades-exporter.fly.dev
#     Preview (staging):
#       NODE_VERSION = 22
#       VITE_API_URL = https://trades-exporter-staging.fly.dev

name = "trades-exporter"
compatibility_date = "2026-04-30"
pages_build_output_dir = "frontend/dist"
