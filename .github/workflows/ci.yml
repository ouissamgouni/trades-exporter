name: CI Pipeline

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"

jobs:
  # ========== BACKEND UNIT TESTS ==========
  backend-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install pytest pytest-cov pytest-mock pytest-xdist pytest-timeout

      - name: Run unit tests only
        working-directory: backend
        run: |
          .venv/bin/python -m pytest tests/unit/ tests/api/ -v --tb=short \
            -n auto --timeout=30 \
            -m "not integration and not network" \
            --ignore=tests/integration \
            --ignore=tests/e2e

  # ========== BACKEND LINTING ==========
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and linters
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy
          pip install -r requirements.txt

      - name: Run Ruff (linter)
        working-directory: backend
        run: |
          ruff check . --output-format=github
        continue-on-error: true

      - name: Check Black formatting
        working-directory: backend
        run: |
          black --check --diff .
        continue-on-error: true

      - name: Run mypy (type checker)
        working-directory: backend
        run: |
          mypy . --ignore-missing-imports --check-untyped-defs
        continue-on-error: true

  # ========== FRONTEND BUILD ==========
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
