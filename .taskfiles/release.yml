version: "3"

tasks:
  default:
    desc: "Tag + deploy to prod (e.g., task release -- v1.2.0)"
    aliases: [release]
    vars:
      VERSION: "{{if .VERSION}}{{.VERSION}}{{else}}{{.CLI_ARGS}}{{end}}"
    cmds:
      - task: ":git:release:tag"
        vars: { VERSION: "{{.VERSION}}" }
      - task: ":deploy:prod:local"
        vars: { CLI_ARGS: "{{.VERSION}}" }
