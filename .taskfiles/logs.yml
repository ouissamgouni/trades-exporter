version: "3"

tasks:
  dev:
    desc: View dev database logs
    dotenv: [.env, .env.dev]
    cmds:
      - docker compose -f infra/docker/docker-compose.dev.yml -p trades-exporter logs -f

  test:
    desc: View test stack logs
    dotenv: [.env, .env.test]
    cmds:
      - docker compose -f infra/docker/docker-compose.test.yml -p trades-exporter logs -f

  prod:
    desc: View prod stack logs
    dotenv: [.env, .env.prod]
    cmds:
      - docker compose -f infra/docker/docker-compose.prod.yml -p trades-exporter logs -f
