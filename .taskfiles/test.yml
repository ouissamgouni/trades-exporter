version: "3"

tasks:
  default:
    desc: Run unit tests (quick, parallel)
    cmds:
      - task: unit

  # =========================================================================
  # Unit Tests (fast, no external dependencies)
  # =========================================================================

  unit:
    desc: Run all unit tests (no database required)
    cmds:
      - task: unit:backend
      - task: unit:frontend
      - cmd: echo "All unit tests passed"

  unit:backend:
    desc: Run backend unit + API tests in parallel
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - "{{.ROOT_DIR}}/.venv/bin/python -m pytest tests/unit/ tests/api/ -v -n auto -m \"not integration\" --timeout=30"

  unit:frontend:
    desc: Run frontend build and type check
    dir: "{{.FRONTEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - npm run build
      - npx tsc --noEmit || true

  # =========================================================================
  # Integration Tests — chunked by category
  # =========================================================================

  int:cex:
    desc: "Integration: CEX connector tests (Binance, OKX, MEXC, Coinbase)"
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running CEX integration tests..."
        {{.ROOT_DIR}}/.venv/bin/python -m pytest tests/integration/cex/ -v -m integration --timeout=60 \
          --ignore=tests/integration/cex/test_int_connector_coinbase_deposits_withdrawals.py

  int:onchain:
    desc: "Integration: Onchain connector tests (Blockscout, Etherscan, Moralis, SUI, Hyperliquid)"
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running onchain integration tests..."
        {{.ROOT_DIR}}/.venv/bin/python -m pytest tests/integration/onchain/ -v -m integration --timeout=120

  int:exchanges:
    desc: "Integration: Exchange-specific tests (MEXC deposits/withdrawals)"
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running exchange integration tests..."
        {{.ROOT_DIR}}/.venv/bin/python -m pytest tests/integration/exchanges/ -v -m integration --timeout=60

  int:prices:
    desc: "Integration: Price getter tests (Yahoo, CoinGecko)"
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running price getter integration tests..."
        {{.ROOT_DIR}}/.venv/bin/python -m pytest tests/integration/price_getters/ -v -m "integration and network" --timeout=60

  int:db:
    desc: "Integration: DB-only tests (data health, seeding, bulk update)"
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running DB integration tests..."
        TEST_DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
        DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.ROOT_DIR}}/.venv/bin/python -m pytest \
            tests/integration/test_int_data_health_detectors.py \
            tests/integration/test_int_transfer_dismiss.py \
            tests/integration/test_int_issue_service_counts.py \
            tests/integration/test_int_seeding_and_connectors.py \
            tests/integration/test_bulk_update.py \
            -v -m integration --timeout=120

  # =========================================================================
  # Composite Integration Tasks
  # =========================================================================

  int:
    desc: Run all integration tests against local integration database (trades_db_integ)
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running ALL integration tests against trades_db_integ..."
        TEST_DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
        DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.ROOT_DIR}}/.venv/bin/python -m pytest tests/integration/ -v -m integration \
            --ignore=tests/integration/cex/test_int_connector_coinbase_deposits_withdrawals.py \
            --timeout=120

  int:full:
    desc: Run full integration test cycle (setup → test → cleanup)
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - cmd: echo "Setting up integration test database..."
      - task: :db:setup:integ
      - cmd: echo "Running integration tests..."
      - task: int
      - cmd: echo "Cleaning up integration test database..."
      - task: :db:reset:integ
      - cmd: echo "Integration test cycle complete"

  # =========================================================================
  # E2E Tests
  # =========================================================================

  e2e:
    desc: Run end-to-end tests (requires running database)
    dir: "{{.BACKEND_DIR}}"
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/config/dev.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    cmds:
      - |
        echo "🧪 Running E2E tests..."
        TEST_DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
        DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.ROOT_DIR}}/.venv/bin/python -m pytest tests/e2e/ -v -m e2e --timeout=30

  # =========================================================================
  # Run a specific chunk by name
  # =========================================================================

  # =========================================================================
  # Run everything
  # =========================================================================

  all:
    desc: Run all tests (unit parallel, integration chunks, e2e)
    cmds:
      - cmd: echo "--- Phase 1 - Unit Tests (parallel) ---"
      - task: unit
      - cmd: echo "--- Phase 2 - Integration Tests ---"
      - task: int
      - cmd: echo "--- Phase 3 - E2E Tests ---"
      - task: e2e
      - cmd: echo "All tests passed!"

  # =========================================================================
  # CI & Misc
  # =========================================================================

  ci:
    desc: Simulate full CI locally via Act
    dotenv:
      [
        config/base.env,
        config/dev.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - act push -j backend-tests --container-architecture linux/amd64
