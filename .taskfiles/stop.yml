version: "3"

tasks:
  dev:
    desc: Stop all dev services (db + backend + frontend)
    dotenv: [.env, .env.dev]
    deps: [dev:db, dev:backend, dev:frontend]
    cmds:
      - echo "✅ All dev services stopped"

  dev:db:
    desc: Stop dev database
    dotenv: [.env, .env.dev]
    cmds:
      - docker compose -f infra/docker/docker-compose.dev.yml -p trades-exporter-dev stop
      - echo "✅ Dev database stopped"

  dev:backend:
    desc: Stop dev backend
    dotenv: [.env, .env.dev]
    cmds:
      - |
        if pkill -f "uvicorn backend.api.main:app" 2>/dev/null; then
          echo "✅ Backend stopped"
        else
          echo "ℹ️  Backend not running"
        fi

  dev:frontend:
    desc: Stop dev frontend
    dotenv: [.env, .env.dev]
    cmds:
      - |
        if pkill -f "vite" 2>/dev/null; then
          echo "✅ Frontend stopped"
        else
          echo "ℹ️  Frontend not running"
        fi

  test:
    desc: Stop test stack
    dotenv: [.env, .env.test]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-test down
      - echo "✅ Test stack stopped"

  prod:
    desc: Stop prod stack
    dotenv: [.env, .env.prod]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod down
      - echo "✅ Prod stack stopped"
