version: "3"

tasks:
  migrate:dev:
    desc: Run database migrations on dev
    dir: "{{.ROOT_DIR}}"
    dotenv: [.env, .env.dev]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini upgrade head
      - echo "✅ Dev database migrated"

  migrate:test:
    desc: Run database migrations on test
    dotenv: [.env, .env.test]
    cmds:
      - docker compose -f infra/docker/docker-compose.test.yml -p trades-exporter exec backend_test python -m alembic upgrade head
      - echo "✅ Test database migrated"

  migrate:prod:
    desc: Run database migrations on prod
    dotenv: [.env, .env.prod]
    cmds:
      - docker compose -f infra/docker/docker-compose.prod.yml -p trades-exporter exec backend_prod python -m alembic upgrade head
      - echo "✅ Prod database migrated"

  seed:dev:
    desc: Seed dev database
    dir: "{{.ROOT_DIR}}"
    dotenv: [.env, .env.dev]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/python {{.BACKEND_DIR}}/scripts/seed.py
      - echo "✅ Dev database seeded"

  seed:test:
    desc: Seed test database
    dotenv: [.env, .env.test]
    cmds:
      - docker compose -f infra/docker/docker-compose.test.yml -p trades-exporter exec backend_test python scripts/seed.py
      - echo "✅ Test database seeded"

  reset:dev:
    desc: "⚠️ Reset dev database (drops all tables)"
    prompt: This will DELETE all data in dev database. Continue?
    dir: "{{.ROOT_DIR}}"
    dotenv: [.env, .env.dev]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" echo "y" | {{.BACKEND_DIR}}/.venv/bin/python {{.BACKEND_DIR}}/scripts/reset.py
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/python {{.BACKEND_DIR}}/scripts/seed.py
      - echo "✅ Dev database reset and seeded"

  reset:test:
    desc: "⚠️ Reset test database (drops all tables)"
    prompt: This will DELETE all data in test database. Continue?
    dotenv: [.env, .env.test]
    cmds:
      - docker compose -f infra/docker/docker-compose.test.yml -p trades-exporter exec backend_test sh -c 'echo "y" | python scripts/reset.py && python scripts/seed.py'
      - echo "✅ Test database reset and seeded"

  reset:prod:
    desc: "🚨 Reset prod database (DANGEROUS!)"
    prompt: "🚨 This will DELETE ALL PRODUCTION DATA. Are you absolutely sure?"
    dotenv: [.env, .env.prod]
    cmds:
      - docker compose -f infra/docker/docker-compose.prod.yml -p trades-exporter exec backend_prod sh -c 'echo "y" | python scripts/reset.py && python scripts/seed.py'
      - echo "⚠️ Prod database reset"
