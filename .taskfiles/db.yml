version: "3"

tasks:
  migrate:dev:
    aliases: [migrate]
    desc: Run database migrations on dev
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini upgrade head
      - echo "✅ Dev database migrated"

  migrate:staging:local:
    aliases: [migrate:staging]
    desc: Run database migrations on staging
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend python -m alembic -c backend/alembic.ini upgrade head
      - echo "✅ Staging database migrated"

  migrate:prod:local:
    aliases: [migrate:prod]
    desc: Run database migrations on prod
    dotenv:
      [
        config/base.env,
        config/prod.local.env,
        config/secrets.env,
        config/secrets.prod.local.env,
      ]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod exec backend python -m alembic -c backend/alembic.ini upgrade head
      - echo "✅ Prod database migrated"

  seed:dev:
    aliases: [seed]
    desc: Seed dev database
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed
      - echo "✅ Dev database seeded"

  seed:staging:local:
    aliases: [seed:staging]
    desc: Seed staging database
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend python -m backend.scripts.seed
      - echo "✅ Staging database seeded"

  reset:dev:
    aliases: [reset]
    desc: "⚠️ Reset dev database (drops all tables). DRY_RUN=1 to preview."
    prompt: This will DELETE all data in dev database. Continue?
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        if [ "{{.DRY_RUN}}" = "1" ]; then
          echo "🔍 DRY RUN — would reset dev database:"
          echo "   Host: $POSTGRES_HOST:$POSTGRES_PORT"
          echo "   DB:   $POSTGRES_DB"
          echo "   Actions: drop all tables → run migrations → seed"
          exit 0
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" echo "y" | {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.reset
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed
        echo "✅ Dev database reset and seeded"

  reset:staging:local:
    aliases: [reset:staging]
    desc: "⚠️ Reset staging database (drops all tables). DRY_RUN=1 to preview."
    prompt: This will DELETE all data in staging database. Continue?
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        if [ "{{.DRY_RUN}}" = "1" ]; then
          echo "🔍 DRY RUN — would reset staging database:"
          echo "   Project: trades-exporter-staging"
          echo "   Actions: safety backup → drop all tables → seed"
          exit 0
        fi
        bash .taskfiles/db_backup.sh backup staging pre-reset
        docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend sh -c 'echo "y" | python -m backend.scripts.reset && python -m backend.scripts.seed'
        echo "✅ Staging database reset and seeded"

  # Integration/e2e test databases are no longer special-cased here — they're
  # just named scenarios (see `start:scenario:db SCENARIO=backend-integration-tests`
  # / `SCENARIO=backend-e2e-tests` in .taskfiles/start.yml), provisioned
  # directly by the `test:backend:int` / `test:backend:e2e` tasks themselves
  # (see .taskfiles/test.yml).

  reset:prod:local:
    aliases: [reset:prod]
    desc: "🚨 Reset prod database (DANGEROUS!)"
    prompt: "🚨 This will DELETE ALL PRODUCTION DATA. Are you absolutely sure?"
    dotenv:
      [
        config/base.env,
        config/prod.local.env,
        config/secrets.env,
        config/secrets.prod.local.env,
      ]
    cmds:
      - bash .taskfiles/db_backup.sh backup prod pre-reset
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod exec backend sh -c 'echo "y" | python -m backend.scripts.reset && python -m backend.scripts.seed'
      - echo "⚠️ Prod database reset"

  # === Migration Status & Validation ===

  status:dev:
    desc: Show migration status (current version, heads, pending)
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        echo "📊 Migration Status (dev)"
        echo "========================"
        echo ""
        echo "Current version:"
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini current 2>&1 | grep -v "^\[Alembic\]" | grep -v "^INFO"
        echo ""
        echo "Head(s):"
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>&1 | grep -v "^\[Alembic\]"
        echo ""
        HEAD_COUNT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep -c "(head)" || echo "0")
        if [ "$HEAD_COUNT" -gt 1 ]; then
          echo "⚠️  WARNING: Multiple heads detected ($HEAD_COUNT)! Run 'task db:merge:dev' to fix."
        else
          echo "✅ Single head - migration chain is clean"
        fi

  status:staging:local:
    aliases: [status:staging]
    desc: Show migration status on staging
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    cmds:
      - |
        echo "📊 Migration Status (staging)"
        echo "========================"
        docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend sh -c '
          echo "Current version:"
          python -m alembic -c backend/alembic.ini current
          echo ""
          echo "Head(s):"
          python -m alembic -c backend/alembic.ini heads
        '

  status:prod:local:
    aliases: [status:prod]
    desc: Show migration status on prod
    dotenv:
      [
        config/base.env,
        config/prod.local.env,
        config/secrets.env,
        config/secrets.prod.local.env,
      ]
    cmds:
      - |
        echo "📊 Migration Status (prod)"
        echo "========================"
        docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod exec backend sh -c '
          echo "Current version:"
          python -m alembic -c backend/alembic.ini current
          echo ""
          echo "Head(s):"
          python -m alembic -c backend/alembic.ini heads
        '

  check:dev:
    desc: Validate migration health (for CI/PR checks)
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        echo "🔍 Checking migration health (dev)..."
        HEAD_COUNT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep -c "(head)" || echo "0")
        if [ "$HEAD_COUNT" -gt 1 ]; then
          echo "❌ FAIL: Multiple migration heads detected ($HEAD_COUNT heads)"
          echo ""
          echo "Heads found:"
          PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
            {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null
          echo ""
          echo "Fix: Run 'task db:merge:dev -- \"merge_description\"'"
          exit 1
        fi
        CURRENT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini current 2>/dev/null | grep -v "^\[Alembic\]" | grep -v "^INFO" | awk '{print $1}' | head -1)
        HEAD=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep "(head)" | awk '{print $1}')
        if [ "$CURRENT" != "$HEAD" ] && [ -n "$CURRENT" ]; then
          echo "⚠️  WARNING: Pending migrations exist"
          echo "   Current: $CURRENT"
          echo "   Head:    $HEAD"
          echo "   Run 'task db:migrate:dev' to apply"
        else
          echo "✅ Migration chain is healthy (single head, up to date)"
        fi

  check:staging:local:
    aliases: [check:staging]
    desc: "Test connectivity + validate migration state for the local staging DB (port 5433)"
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    cmds:
      - |
        echo "Checking local staging DB ($(echo "$DATABASE_URL" | sed 's/:[^:@]*@/@/'))..."
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini check 2>&1 && \
          echo "✅ Connected. Migrations are up to date" || \
          echo "⚠️  Connected but migrations need attention"
        echo "Current revision:"
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini current

  check:prod:local:
    aliases: [check:prod]
    desc: "Test connectivity + validate migration state for the local prod DB (port 5434)"
    dotenv:
      [
        config/base.env,
        config/prod.local.env,
        config/secrets.env,
        config/secrets.prod.local.env,
      ]
    cmds:
      - |
        echo "Checking local prod DB ($(echo "$DATABASE_URL" | sed 's/:[^:@]*@/@/'))..."
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini check 2>&1 && \
          echo "✅ Connected. Migrations are up to date" || \
          echo "⚠️  Connected but migrations need attention"
        echo "Current revision:"
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini current

  migrate:scenario:
    desc: "Run migrations on scenario database (SCENARIO=name)"
    dotenv: [config/base.env, config/scenario.env]
    vars:
      SCENARIO: '{{.SCENARIO | default "default"}}'
    cmds:
      - |
        source {{.ROOT_DIR}}/{{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:${SC_DB_PORT}/${SC_DB_NAME}" \
        PYTHONPATH={{.ROOT_DIR}} {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini upgrade head

  history:dev:
    desc: Show migration history
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        echo "📜 Migration History (dev)"
        echo "=========================="
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini history --verbose 2>&1 | grep -v "^\[Alembic\]" | head -50

  merge:dev:
    desc: Merge multiple migration heads
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        HEAD_COUNT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep -c "(head)" || echo "0")
        if [ "$HEAD_COUNT" -le 1 ]; then
          echo "✅ No merge needed - only one head exists"
          exit 0
        fi
        echo "🔀 Merging $HEAD_COUNT migration heads..."
        MSG="${1:-merge_heads}"
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini merge heads -m "$MSG"
        echo "✅ Heads merged. Run 'task db:migrate:dev' to apply."

  stamp:dev:
    desc: "⚠️ Stamp database to a revision (recovery tool)"
    prompt: "This will update alembic_version without running migrations. Continue?"
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task db:stamp:dev -- <revision>"
          echo "       task db:stamp:dev -- head"
          exit 1
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini stamp {{.CLI_ARGS}}
        echo "✅ Database stamped to {{.CLI_ARGS}}"

  downgrade:dev:
    desc: "⚠️ Rollback migrations (use with caution)"
    prompt: "This will rollback migrations. Continue?"
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task db:downgrade:dev -- <revision>"
          echo "       task db:downgrade:dev -- -1  (rollback 1 step)"
          exit 1
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini downgrade {{.CLI_ARGS}}
        echo "✅ Rolled back to {{.CLI_ARGS}}"

  # === Backup / Restore ===
  #
  # Backups: backend/data/backups/{dev,staging,prod}/ and backend/data/backups/scenarios/<name>/
  #   file = <env>_<UTC timestamp>_<label>.dump (+ .meta: checksum, migration rev, row counts)
  #
  #   task db:backup:prod LABEL=before-tax-export     take a backup
  #   task db:backup:list [ENV=prod] [VERIFY=1]       list backups (VERIFY=1 checks checksums)
  #   task db:restore:staging [FROM_ENV=prod]         pick a backup → restore (temp DB + swap)
  #   task db:restore:commit:staging                  keep the restore (drop the previous DB)
  #   task db:restore:rollback:staging                undo the restore
  #   task db:backup:prune:prod KEEP=10               retention
  #
  # pg_dump / pg_restore run inside the env's DB container (versions always match).
  # Staging/prod get an automatic safety backup before restore, copy, reset and db deploys.

  _backup_cli:
    internal: true
    interactive: true
    silent: true
    cmds:
      - >-
        LABEL="{{.LABEL}}" FILE="{{.FILE}}" FROM_ENV="{{.FROM_ENV}}"
        MIGRATE="{{.MIGRATE | default "1"}}" DRY_RUN="{{.DRY_RUN | default "0"}}"
        NO_BACKUP="{{.NO_BACKUP | default "0"}}" KEEP="{{.KEEP | default "10"}}"
        VERIFY="{{.VERIFY | default "0"}}" ASSUME_YES="{{.ASSUME_YES | default "0"}}"
        CONFIRM="{{.CONFIRM}}" ROOT_DIR="{{.ROOT_DIR}}"
        bash .taskfiles/db_backup.sh {{.CMD}} "{{.TARGET}}"

  backup:list:
    desc: "📦 List backups of all envs (ENV=<dev|staging|prod|scenario:<name>> to filter, VERIFY=1 to check checksums)"
    cmds:
      - task: _backup_cli
        vars: { CMD: list, TARGET: '{{.ENV | default ""}}' }

  backup:dev:
    desc: "💾 Back up the dev database. LABEL=<why> (default 'manual')"
    cmds:
      - task: _backup_cli
        vars: { CMD: backup, TARGET: 'dev' }

  backup:staging:local:
    aliases: [backup:staging]
    desc: "💾 Back up the staging database. LABEL=<why> (default 'manual')"
    cmds:
      - task: _backup_cli
        vars: { CMD: backup, TARGET: 'staging' }

  backup:prod:local:
    aliases: [backup:prod]
    desc: "💾 Back up the prod database. LABEL=<why> (default 'manual')"
    cmds:
      - task: _backup_cli
        vars: { CMD: backup, TARGET: 'prod' }

  backup:scenario:
    desc: "💾 Back up the scenario (SCENARIO=<name>) database. LABEL=<why> (default 'manual')"
    cmds:
      - task: _backup_cli
        vars: { CMD: backup, TARGET: '{{printf "scenario:%s" (.SCENARIO | default "default")}}' }

  backup:prune:dev:
    desc: "🧹 Delete old dev backups, keeping the newest KEEP (default 10). DRY_RUN=1 to preview"
    cmds:
      - task: _backup_cli
        vars: { CMD: prune, TARGET: 'dev' }

  backup:prune:staging:local:
    aliases: [backup:prune:staging]
    desc: "🧹 Delete old staging backups, keeping the newest KEEP (default 10). DRY_RUN=1 to preview"
    cmds:
      - task: _backup_cli
        vars: { CMD: prune, TARGET: 'staging' }

  backup:prune:prod:local:
    aliases: [backup:prune:prod]
    desc: "🧹 Delete old prod backups, keeping the newest KEEP (default 10). DRY_RUN=1 to preview"
    cmds:
      - task: _backup_cli
        vars: { CMD: prune, TARGET: 'prod' }

  backup:prune:scenario:
    desc: "🧹 Delete old scenario (SCENARIO=<name>) backups, keeping the newest KEEP (default 10). DRY_RUN=1 to preview"
    cmds:
      - task: _backup_cli
        vars: { CMD: prune, TARGET: '{{printf "scenario:%s" (.SCENARIO | default "default")}}' }

  restore:dev:
    desc: "♻️  Restore the dev database from a backup (pick from a list, or FILE=<path|latest>). FROM_ENV=<env>, MIGRATE=0, DRY_RUN=1"
    interactive: true
    cmds:
      - task: _backup_cli
        vars: { CMD: restore, TARGET: 'dev' }

  restore:staging:local:
    aliases: [restore:staging]
    desc: "♻️  Restore the staging database from a backup (pick from a list, or FILE=<path|latest>). FROM_ENV=<env>, MIGRATE=0, DRY_RUN=1"
    interactive: true
    cmds:
      - task: _backup_cli
        vars: { CMD: restore, TARGET: 'staging' }

  restore:prod:local:
    aliases: [restore:prod]
    desc: "♻️  Restore the prod database from a backup (pick from a list, or FILE=<path|latest>). FROM_ENV=<env>, MIGRATE=0, DRY_RUN=1"
    interactive: true
    cmds:
      - task: _backup_cli
        vars: { CMD: restore, TARGET: 'prod' }

  restore:scenario:
    desc: "♻️  Restore the scenario (SCENARIO=<name>) database from a backup (pick from a list, or FILE=<path|latest>). FROM_ENV=<env>, MIGRATE=0, DRY_RUN=1"
    interactive: true
    cmds:
      - task: _backup_cli
        vars: { CMD: restore, TARGET: '{{printf "scenario:%s" (.SCENARIO | default "default")}}' }

  restore:commit:dev:
    desc: "✅ Keep the last dev restore: drop the previous database kept for rollback"
    cmds:
      - task: _backup_cli
        vars: { CMD: commit, TARGET: 'dev' }

  restore:commit:staging:local:
    aliases: [restore:commit:staging]
    desc: "✅ Keep the last staging restore: drop the previous database kept for rollback"
    cmds:
      - task: _backup_cli
        vars: { CMD: commit, TARGET: 'staging' }

  restore:commit:prod:local:
    aliases: [restore:commit:prod]
    desc: "✅ Keep the last prod restore: drop the previous database kept for rollback"
    cmds:
      - task: _backup_cli
        vars: { CMD: commit, TARGET: 'prod' }

  restore:commit:scenario:
    desc: "✅ Keep the last scenario (SCENARIO=<name>) restore: drop the previous database kept for rollback"
    cmds:
      - task: _backup_cli
        vars: { CMD: commit, TARGET: '{{printf "scenario:%s" (.SCENARIO | default "default")}}' }

  restore:rollback:dev:
    desc: "↩️  Undo the last dev restore: swap the previous database back in"
    cmds:
      - task: _backup_cli
        vars: { CMD: rollback, TARGET: 'dev' }

  restore:rollback:staging:local:
    aliases: [restore:rollback:staging]
    desc: "↩️  Undo the last staging restore: swap the previous database back in"
    cmds:
      - task: _backup_cli
        vars: { CMD: rollback, TARGET: 'staging' }

  restore:rollback:prod:local:
    aliases: [restore:rollback:prod]
    desc: "↩️  Undo the last prod restore: swap the previous database back in"
    cmds:
      - task: _backup_cli
        vars: { CMD: rollback, TARGET: 'prod' }

  restore:rollback:scenario:
    desc: "↩️  Undo the last scenario (SCENARIO=<name>) restore: swap the previous database back in"
    cmds:
      - task: _backup_cli
        vars: { CMD: rollback, TARGET: '{{printf "scenario:%s" (.SCENARIO | default "default")}}' }

  restore:status:dev:
    desc: "🗄️  Show dev databases (live + kept by restores) and their provenance"
    cmds:
      - task: _backup_cli
        vars: { CMD: status, TARGET: 'dev' }

  restore:status:staging:local:
    aliases: [restore:status:staging]
    desc: "🗄️  Show staging databases (live + kept by restores) and their provenance"
    cmds:
      - task: _backup_cli
        vars: { CMD: status, TARGET: 'staging' }

  restore:status:prod:local:
    aliases: [restore:status:prod]
    desc: "🗄️  Show prod databases (live + kept by restores) and their provenance"
    cmds:
      - task: _backup_cli
        vars: { CMD: status, TARGET: 'prod' }

  restore:status:scenario:
    desc: "🗄️  Show scenario (SCENARIO=<name>) databases (live + kept by restores) and their provenance"
    cmds:
      - task: _backup_cli
        vars: { CMD: status, TARGET: '{{printf "scenario:%s" (.SCENARIO | default "default")}}' }

  # === Database Copy / Promotion ===
  #
  # Same safe path as db:restore (temp DB → row check → migrate → swap; previous DB kept).
  #   task db:copy:dev-to-staging | staging-to-dev | staging-to-prod | prod-to-staging
  #   task db:copy -- <src> <dst> [--no-migrate] [--no-backup]   (env: dev | staging | prod | scenario:<name>)
  #   DRY_RUN=1 previews; then db:restore:commit:<dst> / db:restore:rollback:<dst>.

  _copy:
    internal: true
    interactive: true
    silent: true
    cmds:
      - >-
        DRY_RUN="{{.DRY_RUN | default "0"}}" MIGRATE="{{.MIGRATE | default "1"}}"
        NO_BACKUP="{{.NO_BACKUP | default "0"}}" ASSUME_YES="{{.ASSUME_YES | default "0"}}"
        CONFIRM="{{.CONFIRM}}" ROOT_DIR="{{.ROOT_DIR}}"
        bash .taskfiles/db_copy.sh {{.ARGS}}

  copy:dev-to-staging:
    desc: "🔄 Copy dev database → staging (migrates, keeps previous staging DB for rollback). DRY_RUN=1 to preview."
    interactive: true
    cmds:
      - task: _copy
        vars: { ARGS: "dev staging" }

  copy:staging-to-dev:
    desc: "🔄 Copy staging database → dev (migrates, keeps previous dev DB for rollback). DRY_RUN=1 to preview."
    interactive: true
    cmds:
      - task: _copy
        vars: { ARGS: "staging dev" }

  copy:staging-to-prod:
    desc: "⚠️ Copy staging database → prod (migrates, keeps previous prod DB for rollback). DRY_RUN=1 to preview."
    interactive: true
    cmds:
      - task: _copy
        vars: { ARGS: "staging prod" }

  copy:prod-to-staging:
    desc: "🔄 Copy prod database → staging (migrates, keeps previous staging DB for rollback). DRY_RUN=1 to preview."
    interactive: true
    cmds:
      - task: _copy
        vars: { ARGS: "prod staging" }

  copy:
    desc: "🔄 Copy a database between any two envs. DRY_RUN=1 to preview. (usage: task db:copy -- <src> <dst> [--no-migrate] [--no-backup])"
    interactive: true
    cmds:
      - task: _copy
        vars: { ARGS: "{{.CLI_ARGS}}" }

  # === Tag Cleanup ===

  cleanup-tags:dev:
    desc: "🧹 Clean up tags from dev transactions (DRY_RUN=1, ALL=1, KEY=<key>)"
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
      ALL: '{{.ALL | default "0"}}'
      KEY: '{{.KEY | default ""}}'
    cmds:
      - |
        FLAGS="--backup"
        if [ "{{.DRY_RUN}}" = "1" ]; then
          FLAGS="--dry-run"
        fi
        if [ "{{.ALL}}" = "1" ]; then
          FLAGS="$FLAGS --no-preserve-system"
        fi
        if [ -n "{{.KEY}}" ]; then
          FLAGS="$FLAGS --tag-key {{.KEY}}"
        fi
        if [ "{{.DRY_RUN}}" != "1" ] && [ "{{.ALL}}" != "1" ] && [ -z "{{.KEY}}" ]; then
          echo "This will remove user tags from transactions (system tags preserved). Continue? [y/N]"
          read -r REPLY
          if [ "$REPLY" != "y" ] && [ "$REPLY" != "Y" ]; then
            echo "Cancelled."
            exit 0
          fi
        fi
        if [ "{{.ALL}}" = "1" ] && [ "{{.DRY_RUN}}" != "1" ]; then
          echo "🚨 This will remove ALL tags including system tags. Continue? [y/N]"
          read -r REPLY
          if [ "$REPLY" != "y" ] && [ "$REPLY" != "Y" ]; then
            echo "Cancelled."
            exit 0
          fi
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.cleanup_tags $FLAGS
        echo "✅ Tag cleanup complete"

  cleanup-tags:staging:local:
    aliases: [cleanup-tags:staging]
    desc: "🧹 Clean up user tags from staging database. DRY_RUN=1 to preview."
    prompt: "This will remove user tags from staging transactions. Continue?"
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        FLAGS="--backup"
        if [ "{{.DRY_RUN}}" = "1" ]; then
          FLAGS="--dry-run"
        fi
        docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend python -m backend.scripts.cleanup_tags $FLAGS
      - echo "✅ Staging database user tags cleaned up"

  # === Scenario Database ===

  seed:scenario:
    desc: "Seed scenario database (SCENARIO=<name>, SEED_DIR=<path>, WITH_DEFAULTS=1)"
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh
    cmds:
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        SCENARIO_LABEL="{{.SCENARIO}}"; [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"
        STATE_FILE="{{.ROOT_DIR}}/.taskfiles/.scenario-state/$SCENARIO_LABEL.env"
        [ -f "$STATE_FILE" ] && source "$STATE_FILE"
        SEED_DIR="{{.SEED_DIR}}"
        WITH_DEFAULTS="{{.WITH_DEFAULTS}}"
        # Auto-resolve SEED_DIR from SCENARIO
        if [ -z "$SEED_DIR" ] && [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          CANDIDATE="{{.ROOT_DIR}}/scenarios/{{.SCENARIO}}"
          if [ -d "$CANDIDATE" ]; then
            SEED_DIR="$CANDIDATE"
            echo "Auto-resolved SEED_DIR from SCENARIO={{.SCENARIO}}"
          fi
        fi
        # Detect if running in Docker mode or hybrid mode
        if docker ps --filter "name=$SC_BACKEND_CONTAINER" --filter "status=running" --format '{{`{{.Names}}`}}' | grep -q "$SC_BACKEND_CONTAINER"; then
          if [ -n "$SEED_DIR" ]; then
            if [ "$WITH_DEFAULTS" = "1" ]; then
              echo "Seeding default data first (WITH_DEFAULTS=1)..."
              docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed
            fi
            echo "Seeding scenario from $SEED_DIR..."
            docker cp "$SEED_DIR/." $SC_BACKEND_CONTAINER:/tmp/scenario/
            docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed --seed-dir /tmp/scenario
          else
            echo "Seeding default data..."
            docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed
          fi
        else
          if [ -n "$SEED_DIR" ]; then
            if [ "$WITH_DEFAULTS" = "1" ]; then
              echo "Seeding default data first (WITH_DEFAULTS=1)..."
              PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
                {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed
            fi
            echo "Seeding scenario from $SEED_DIR..."
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
              {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed --seed-dir "$SEED_DIR"
          else
            echo "Seeding default data..."
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
              {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed
          fi
        fi
      - echo "✅ Scenario database seeded"

  reset:scenario:
    desc: "Reset scenario database (truncate + reseed). SCENARIO=<name>, DRY_RUN=1 to preview."
    prompt: This will DELETE all data in scenario database. Continue?
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
      SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh
    cmds:
      - |
        if [ "{{.DRY_RUN}}" = "1" ]; then
          source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
          SCENARIO_LABEL="{{.SCENARIO}}"; [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"
          STATE_FILE="{{.ROOT_DIR}}/.taskfiles/.scenario-state/$SCENARIO_LABEL.env"
          [ -f "$STATE_FILE" ] && source "$STATE_FILE"
          echo "🔍 DRY RUN — would reset scenario database:"
          echo "   Instance: $SCENARIO_LABEL"
          echo "   DB port:  $SC_DB_PORT"
          echo "   Actions: drop all tables → seed"
          exit 0
        fi
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        SCENARIO_LABEL="{{.SCENARIO}}"; [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"
        STATE_FILE="{{.ROOT_DIR}}/.taskfiles/.scenario-state/$SCENARIO_LABEL.env"
        [ -f "$STATE_FILE" ] && source "$STATE_FILE"
        SEED_DIR="{{.SEED_DIR}}"
        # Auto-resolve SEED_DIR from SCENARIO
        if [ -z "$SEED_DIR" ] && [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          CANDIDATE="{{.ROOT_DIR}}/scenarios/{{.SCENARIO}}"
          if [ -d "$CANDIDATE" ]; then
            SEED_DIR="$CANDIDATE"
          fi
        fi
        if docker ps --filter "name=$SC_BACKEND_CONTAINER" --filter "status=running" --format '{{`{{.Names}}`}}' | grep -q "$SC_BACKEND_CONTAINER"; then
          docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend sh -c 'echo "y" | python -m backend.scripts.reset'
          if [ -n "$SEED_DIR" ]; then
            docker cp "$SEED_DIR/." $SC_BACKEND_CONTAINER:/tmp/scenario/
            docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed --seed-dir /tmp/scenario
          else
            docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed
          fi
        else
          PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
            echo "y" | {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.reset
          if [ -n "$SEED_DIR" ]; then
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
              {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed --seed-dir "$SEED_DIR"
          else
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
              {{.ROOT_DIR}}/.venv/bin/python -m backend.scripts.seed
          fi
        fi
        echo "✅ Scenario database reset and seeded"
