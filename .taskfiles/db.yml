version: "3"

tasks:
  migrate:dev:
    desc: Run database migrations on dev
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini upgrade head
      - echo "✅ Dev database migrated"

  migrate:staging:
    desc: Run database migrations on staging
    dotenv: [config/base.env, config/staging.env, config/secrets.env, config/secrets.staging.env]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend python -m alembic upgrade head
      - echo "✅ Staging database migrated"

  migrate:prod:
    desc: Run database migrations on prod
    dotenv: [config/base.env, config/prod.env, config/secrets.env, config/secrets.prod.env]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod exec backend python -m alembic upgrade head
      - echo "✅ Prod database migrated"

  seed:dev:
    desc: Seed dev database
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
      - echo "✅ Dev database seeded"

  seed:staging:
    desc: Seed staging database
    dotenv: [config/base.env, config/staging.env, config/secrets.env, config/secrets.staging.env]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend python -m backend.scripts.seed
      - echo "✅ Staging database seeded"

  reset:dev:
    desc: "⚠️ Reset dev database (drops all tables). DRY_RUN=1 to preview."
    prompt: This will DELETE all data in dev database. Continue?
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        if [ "{{.DRY_RUN}}" = "1" ]; then
          echo "🔍 DRY RUN — would reset dev database:"
          echo "   Host: $POSTGRES_HOST:$POSTGRES_PORT"
          echo "   DB:   $POSTGRES_DB"
          echo "   Actions: drop all tables → run migrations → seed"
          exit 0
        fi
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" echo "y" | {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.reset
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
      - echo "✅ Dev database reset and seeded"

  reset:staging:
    desc: "⚠️ Reset staging database (drops all tables). DRY_RUN=1 to preview."
    prompt: This will DELETE all data in staging database. Continue?
    dotenv: [config/base.env, config/staging.env, config/secrets.env, config/secrets.staging.env]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        if [ "{{.DRY_RUN}}" = "1" ]; then
          echo "🔍 DRY RUN — would reset staging database:"
          echo "   Project: trades-exporter-staging"
          echo "   Actions: drop all tables → seed"
          exit 0
        fi
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend sh -c 'echo "y" | python -m backend.scripts.reset && python -m backend.scripts.seed'
      - echo "✅ Staging database reset and seeded"

  # === Integration Test Database ===

  setup:integ:
    desc: Setup integration test database (one-time setup)
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        echo "🔧 Setting up integration test database (trades_db_integ)..."
        PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -c "DROP DATABASE IF EXISTS trades_db_integ;" postgres || true
        PGPASSWORD=$POSTGRES_PASSWORD psql -h $POSTGRES_HOST -U $POSTGRES_USER -c "CREATE DATABASE trades_db_integ;" postgres
      - |
        echo "Creating tables from SQLModel..."
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.BACKEND_DIR}}/.venv/bin/python -c "from backend.db.database import get_engine; from backend.db.models import SQLModel; SQLModel.metadata.create_all(get_engine())"
      - |
        echo "Stamping database to current migration..."
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini stamp head
      - |
        echo "Seeding test data..."
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
      - echo "✅ Integration test database ready (trades_db_integ)"

  reset:integ:
    desc: Reset integration test database
    prompt: This will reset the integration test database. Continue?
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        echo "🔄 Resetting integration test database..."
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          echo "y" | {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.reset
      - |
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/trades_db_integ" \
          {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
      - echo "✅ Integration test database reset and seeded"

  reset:prod:
    desc: "🚨 Reset prod database (DANGEROUS!)"
    prompt: "🚨 This will DELETE ALL PRODUCTION DATA. Are you absolutely sure?"
    dotenv: [config/base.env, config/prod.env, config/secrets.env, config/secrets.prod.env]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod exec backend sh -c 'echo "y" | python -m backend.scripts.reset && python -m backend.scripts.seed'
      - echo "⚠️ Prod database reset"

  # === Migration Status & Validation ===

  status:dev:
    desc: Show migration status (current version, heads, pending)
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        echo "📊 Migration Status (dev)"
        echo "========================"
        echo ""
        echo "Current version:"
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini current 2>&1 | grep -v "^\[Alembic\]" | grep -v "^INFO"
        echo ""
        echo "Head(s):"
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>&1 | grep -v "^\[Alembic\]"
        echo ""
        HEAD_COUNT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep -c "(head)" || echo "0")
        if [ "$HEAD_COUNT" -gt 1 ]; then
          echo "⚠️  WARNING: Multiple heads detected ($HEAD_COUNT)! Run 'task db:merge:dev' to fix."
        else
          echo "✅ Single head - migration chain is clean"
        fi

  status:staging:
    desc: Show migration status on staging
    dotenv: [config/base.env, config/staging.env, config/secrets.env, config/secrets.staging.env]
    cmds:
      - |
        echo "📊 Migration Status (staging)"
        echo "========================"
        docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend sh -c '
          echo "Current version:"
          python -m alembic current
          echo ""
          echo "Head(s):"
          python -m alembic heads
        '

  check:dev:
    desc: Validate migration health (for CI/PR checks)
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        echo "🔍 Checking migration health (dev)..."
        HEAD_COUNT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep -c "(head)" || echo "0")
        if [ "$HEAD_COUNT" -gt 1 ]; then
          echo "❌ FAIL: Multiple migration heads detected ($HEAD_COUNT heads)"
          echo ""
          echo "Heads found:"
          PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
            {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null
          echo ""
          echo "Fix: Run 'task db:merge:dev -- \"merge_description\"'"
          exit 1
        fi
        CURRENT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini current 2>/dev/null | grep -v "^\[Alembic\]" | grep -v "^INFO" | awk '{print $1}' | head -1)
        HEAD=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep "(head)" | awk '{print $1}')
        if [ "$CURRENT" != "$HEAD" ] && [ -n "$CURRENT" ]; then
          echo "⚠️  WARNING: Pending migrations exist"
          echo "   Current: $CURRENT"
          echo "   Head:    $HEAD"
          echo "   Run 'task db:migrate:dev' to apply"
        else
          echo "✅ Migration chain is healthy (single head, up to date)"
        fi

  history:dev:
    desc: Show migration history
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        echo "📜 Migration History (dev)"
        echo "=========================="
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini history --verbose 2>&1 | grep -v "^\[Alembic\]" | head -50

  merge:dev:
    desc: Merge multiple migration heads
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        HEAD_COUNT=$(PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini heads 2>/dev/null | grep -c "(head)" || echo "0")
        if [ "$HEAD_COUNT" -le 1 ]; then
          echo "✅ No merge needed - only one head exists"
          exit 0
        fi
        echo "🔀 Merging $HEAD_COUNT migration heads..."
        MSG="${1:-merge_heads}"
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini merge heads -m "$MSG"
        echo "✅ Heads merged. Run 'task db:migrate:dev' to apply."

  stamp:dev:
    desc: "⚠️ Stamp database to a revision (recovery tool)"
    prompt: "This will update alembic_version without running migrations. Continue?"
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task db:stamp:dev -- <revision>"
          echo "       task db:stamp:dev -- head"
          exit 1
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini stamp {{.CLI_ARGS}}
        echo "✅ Database stamped to {{.CLI_ARGS}}"

  downgrade:dev:
    desc: "⚠️ Rollback migrations (use with caution)"
    prompt: "This will rollback migrations. Continue?"
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task db:downgrade:dev -- <revision>"
          echo "       task db:downgrade:dev -- -1  (rollback 1 step)"
          exit 1
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/alembic -c {{.BACKEND_DIR}}/alembic.ini downgrade {{.CLI_ARGS}}
        echo "✅ Rolled back to {{.CLI_ARGS}}"

  # === Tag Cleanup ===

  # === Database Copy / Promotion ===
  #
  # Named shortcuts (recommended):
  #   task db:copy:dev-to-staging      Copy dev → staging
  #   task db:copy:staging-to-prod     Copy staging → prod (with extra warning)
  #
  # Generic (any direction):
  #   task db:copy -- dev staging      Same as copy:dev-to-staging
  #   task db:copy -- dev prod         Any custom combination
  #
  # Dry-run (preview only):
  #   task db:copy:dry-run -- dev test
  #

  copy:dev-to-staging:
    desc: "🔄 Copy dev database → staging. DRY_RUN=1 to preview."
    prompt: "This will REPLACE the staging database with dev data. Continue?"
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        FLAGS=""
        if [ "{{.DRY_RUN}}" = "1" ]; then FLAGS="--dry-run"; fi
        {{.BACKEND_DIR}}/scripts/db_copy.sh {{.ROOT_DIR}}/config/dev.env {{.ROOT_DIR}}/config/staging.env $FLAGS

  copy:staging-to-dev:
    desc: "🔄 Copy staging database → dev (with schema migration). DRY_RUN=1 to preview."
    prompt: "This will REPLACE the dev database with staging data and run migrations. Continue?"
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        FLAGS="--migrate"
        if [ "{{.DRY_RUN}}" = "1" ]; then FLAGS="$FLAGS --dry-run"; fi
        BACKEND_DIR={{.BACKEND_DIR}} ROOT_DIR={{.ROOT_DIR}} {{.BACKEND_DIR}}/scripts/db_copy.sh {{.ROOT_DIR}}/config/staging.env {{.ROOT_DIR}}/config/dev.env $FLAGS

  copy:staging-to-prod:
    desc: "⚠️ Copy staging database → prod (promotes to production). DRY_RUN=1 to preview."
    prompt: "⚠️ This will REPLACE the PRODUCTION database with staging data. Continue?"
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        FLAGS=""
        if [ "{{.DRY_RUN}}" = "1" ]; then FLAGS="--dry-run"; fi
        {{.BACKEND_DIR}}/scripts/db_copy.sh {{.ROOT_DIR}}/config/staging.env {{.ROOT_DIR}}/config/prod.env $FLAGS

  copy:
    desc: "🔄 Copy a database between any two envs. DRY_RUN=1 to preview. (usage: task db:copy -- <src> <dst> [--migrate])"
    prompt: "This will REPLACE the target database with source data. Continue?"
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        ARGS="{{.CLI_ARGS}}"
        SRC=""
        DST=""
        EXTRA_FLAGS=""

        for arg in $ARGS; do
          case "$arg" in
            --migrate) EXTRA_FLAGS="$EXTRA_FLAGS --migrate" ;;
            --dry-run) EXTRA_FLAGS="$EXTRA_FLAGS --dry-run" ;;
            *)
              if [ -z "$SRC" ]; then
                SRC="$arg"
              elif [ -z "$DST" ]; then
                DST="$arg"
              fi
              ;;
          esac
        done

        if [ -z "$SRC" ] || [ -z "$DST" ]; then
          echo "Usage: task db:copy -- <source> <target> [--migrate]"
          echo "       task db:copy -- dev staging"
          echo "       task db:copy -- staging dev --migrate"
          echo ""
          echo "Or use the named shortcuts:"
          echo "       task db:copy:dev-to-staging"
          echo "       task db:copy:staging-to-dev    (includes --migrate)"
          echo "       task db:copy:staging-to-prod"
          echo ""
          echo "Available environments: dev, staging, prod, scenario"
          exit 1
        fi

        if [ "$SRC" = "$DST" ]; then
          echo "❌ Source and target must be different environments"
          exit 1
        fi

        SRC_ENV="{{.ROOT_DIR}}/config/$SRC.env"
        DST_ENV="{{.ROOT_DIR}}/config/$DST.env"

        if [ "{{.DRY_RUN}}" = "1" ]; then
          EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
        fi

        exec env BACKEND_DIR="{{.BACKEND_DIR}}" ROOT_DIR="{{.ROOT_DIR}}" \
          "{{.BACKEND_DIR}}/scripts/db_copy.sh" "$SRC_ENV" "$DST_ENV" $EXTRA_FLAGS

  # === Tag Cleanup ===

  cleanup-tags:dev:
    desc: "🧹 Clean up tags from dev transactions (DRY_RUN=1, ALL=1, KEY=<key>)"
    dotenv: [config/base.env, config/dev.env, config/secrets.env, config/secrets.dev.env]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
      ALL: '{{.ALL | default "0"}}'
      KEY: '{{.KEY | default ""}}'
    cmds:
      - |
        FLAGS="--backup"
        if [ "{{.DRY_RUN}}" = "1" ]; then
          FLAGS="--dry-run"
        fi
        if [ "{{.ALL}}" = "1" ]; then
          FLAGS="$FLAGS --no-preserve-system"
        fi
        if [ -n "{{.KEY}}" ]; then
          FLAGS="$FLAGS --tag-key {{.KEY}}"
        fi
        if [ "{{.DRY_RUN}}" != "1" ] && [ "{{.ALL}}" != "1" ] && [ -z "{{.KEY}}" ]; then
          echo "This will remove user tags from transactions (system tags preserved). Continue? [y/N]"
          read -r REPLY
          if [ "$REPLY" != "y" ] && [ "$REPLY" != "Y" ]; then
            echo "Cancelled."
            exit 0
          fi
        fi
        if [ "{{.ALL}}" = "1" ] && [ "{{.DRY_RUN}}" != "1" ]; then
          echo "🚨 This will remove ALL tags including system tags. Continue? [y/N]"
          read -r REPLY
          if [ "$REPLY" != "y" ] && [ "$REPLY" != "Y" ]; then
            echo "Cancelled."
            exit 0
          fi
        fi
        PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
          {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.cleanup_tags $FLAGS
        echo "✅ Tag cleanup complete"

  cleanup-tags:staging:
    desc: "🧹 Clean up user tags from staging database. DRY_RUN=1 to preview."
    prompt: "This will remove user tags from staging transactions. Continue?"
    dotenv: [config/base.env, config/staging.env, config/secrets.env, config/secrets.staging.env]
    vars:
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
    cmds:
      - |
        FLAGS="--backup"
        if [ "{{.DRY_RUN}}" = "1" ]; then
          FLAGS="--dry-run"
        fi
        docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging exec backend python -m backend.scripts.cleanup_tags $FLAGS
      - echo "✅ Staging database user tags cleaned up"

  # === Scenario Database ===

  seed:scenario:
    desc: "Seed scenario database (SCENARIO=<name>, SEED_DIR=<path>, WITH_DEFAULTS=1)"
    dotenv: [config/base.env, config/scenario.env, config/secrets.env, config/secrets.scenario.env]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh
    cmds:
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        SEED_DIR="{{.SEED_DIR}}"
        WITH_DEFAULTS="{{.WITH_DEFAULTS}}"
        # Auto-resolve SEED_DIR from SCENARIO
        if [ -z "$SEED_DIR" ] && [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          CANDIDATE="{{.ROOT_DIR}}/scenarios/{{.SCENARIO}}"
          if [ -d "$CANDIDATE" ]; then
            SEED_DIR="$CANDIDATE"
            echo "Auto-resolved SEED_DIR from SCENARIO={{.SCENARIO}}"
          fi
        fi
        # Detect if running in Docker mode or hybrid mode
        if docker ps --filter "name=$QA_BACKEND_CONTAINER" --filter "status=running" --format '{{`{{.Names}}`}}' | grep -q "$QA_BACKEND_CONTAINER"; then
          if [ -n "$SEED_DIR" ]; then
            if [ "$WITH_DEFAULTS" = "1" ]; then
              echo "Seeding default data first (WITH_DEFAULTS=1)..."
              docker compose -f infra/docker/docker-compose.unified.yml -p $QA_PROJECT exec backend python -m backend.scripts.seed
            fi
            echo "Seeding scenario from $SEED_DIR..."
            docker cp "$SEED_DIR/." $QA_BACKEND_CONTAINER:/tmp/scenario/
            docker compose -f infra/docker/docker-compose.unified.yml -p $QA_PROJECT exec backend python -m backend.scripts.seed --seed-dir /tmp/scenario
          else
            echo "Seeding default data..."
            docker compose -f infra/docker/docker-compose.unified.yml -p $QA_PROJECT exec backend python -m backend.scripts.seed
          fi
        else
          if [ -n "$SEED_DIR" ]; then
            if [ "$WITH_DEFAULTS" = "1" ]; then
              echo "Seeding default data first (WITH_DEFAULTS=1)..."
              PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$QA_DB_PORT/$POSTGRES_DB" \
                {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
            fi
            echo "Seeding scenario from $SEED_DIR..."
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$QA_DB_PORT/$POSTGRES_DB" \
              {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed --seed-dir "$SEED_DIR"
          else
            echo "Seeding default data..."
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$QA_DB_PORT/$POSTGRES_DB" \
              {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
          fi
        fi
      - echo "✅ Scenario database seeded"

  reset:scenario:
    desc: "Reset scenario database (truncate + reseed). SCENARIO=<name>, DRY_RUN=1 to preview."
    prompt: This will DELETE all data in scenario database. Continue?
    dotenv: [config/base.env, config/scenario.env, config/secrets.env, config/secrets.scenario.env]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      DRY_RUN: '{{.DRY_RUN | default "0"}}'
      SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh
    cmds:
      - |
        if [ "{{.DRY_RUN}}" = "1" ]; then
          source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
          echo "🔍 DRY RUN — would reset scenario database:"
          echo "   Instance: {{.SCENARIO | default \"default\"}}"
          echo "   DB port:  $QA_DB_PORT"
          echo "   Actions: drop all tables → seed"
          exit 0
        fi
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        SEED_DIR="{{.SEED_DIR}}"
        # Auto-resolve SEED_DIR from SCENARIO
        if [ -z "$SEED_DIR" ] && [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          CANDIDATE="{{.ROOT_DIR}}/scenarios/{{.SCENARIO}}"
          if [ -d "$CANDIDATE" ]; then
            SEED_DIR="$CANDIDATE"
          fi
        fi
        if docker ps --filter "name=$QA_BACKEND_CONTAINER" --filter "status=running" --format '{{`{{.Names}}`}}' | grep -q "$QA_BACKEND_CONTAINER"; then
          docker compose -f infra/docker/docker-compose.unified.yml -p $QA_PROJECT exec backend sh -c 'echo "y" | python -m backend.scripts.reset'
          if [ -n "$SEED_DIR" ]; then
            docker cp "$SEED_DIR/." $QA_BACKEND_CONTAINER:/tmp/scenario/
            docker compose -f infra/docker/docker-compose.unified.yml -p $QA_PROJECT exec backend python -m backend.scripts.seed --seed-dir /tmp/scenario
          else
            docker compose -f infra/docker/docker-compose.unified.yml -p $QA_PROJECT exec backend python -m backend.scripts.seed
          fi
        else
          PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$QA_DB_PORT/$POSTGRES_DB" \
            echo "y" | {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.reset
          if [ -n "$SEED_DIR" ]; then
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$QA_DB_PORT/$POSTGRES_DB" \
              {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed --seed-dir "$SEED_DIR"
          else
            PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$QA_DB_PORT/$POSTGRES_DB" \
              {{.BACKEND_DIR}}/.venv/bin/python -m backend.scripts.seed
          fi
        fi
      - echo "✅ Scenario database reset and seeded"
