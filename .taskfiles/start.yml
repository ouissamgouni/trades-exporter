version: "3"

tasks:
  dev:db:
    desc: Start dev environment (database)
    dotenv: [.env, .env.dev]
    cmds:
      - docker compose -f infra/docker/docker-compose.dev.yml -p trades-exporter-dev up -d postgres_dev
      - |
        # Wait for postgres to be healthy
        for i in {1..30}; do
          if docker exec trades_db_dev pg_isready -U trades_user -d trades_db_dev &>/dev/null; then
            echo "✅ Database is ready"
            break
          fi
          echo "⏳ Waiting for database... ($i/30)"
          sleep 1
        done
      - |
        echo ""
        echo "✅ Dev database running on localhost:${POSTGRES_PORT}"
        echo ""
        echo "Next steps:"
        echo "  task start:dev:backend        → Start backend"
        echo "  task start:dev:backend:debug  → Start backend with debugger"
        echo "  task start:dev:frontend       → Start frontend"
        echo "  task start:dev:debug          → Start all with debugging"

  dev:debug:
    desc: Start full dev environment with debugging (DB + backend + frontend)
    dotenv: [.env, .env.dev]
    deps: [dev:db]
    cmds:
      - |
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "✅ Starting all services with live logs"
        echo ""
        echo "Services:"
        echo "   [DB]  Database on localhost:${POSTGRES_PORT}"
        echo "   [API] Backend on localhost:${BACKEND_PORT} (debugger: ${DEBUGPY_PORT})"
        echo "   [WEB] Frontend on localhost:${FRONTEND_PORT}"
        echo ""
        echo "To attach debugger: VSCode → F5 → 'Backend: Attach'"
        echo "Press Ctrl+C to stop all services"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
      - |
        npx concurrently \
          --names "DB,API,WEB" \
          --prefix-colors "blue.bold,yellow.bold,green.bold" \
          --prefix "[{name}] " \
          --kill-others-on-fail \
          "docker compose -f infra/docker/docker-compose.dev.yml -p trades-exporter-dev logs -f postgres_dev" \
          "cd {{.ROOT_DIR}} && PYTHONPATH={{.ROOT_DIR}} DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB {{.BACKEND_DIR}}/.venv/bin/python -m debugpy --listen $DEBUGPY_PORT -m uvicorn backend.api.main:app --reload --port $BACKEND_PORT" \
          "cd {{.FRONTEND_DIR}} && VITE_API_URL=http://localhost:$BACKEND_PORT npm run dev -- --port $FRONTEND_PORT"

  dev:backend:
    desc: Start backend locally (no debugger)
    dir: "{{.ROOT_DIR}}"
    dotenv: [.env, .env.dev]
    cmds:
      - PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/uvicorn backend.api.main:app --reload --port $BACKEND_PORT

  dev:backend:debug:
    desc: Start backend with debugger
    dir: "{{.ROOT_DIR}}"
    dotenv: [.env, .env.dev]
    cmds:
      - 'echo "Starting backend with debugger on port $DEBUGPY_PORT..." && echo "→ In VSCode: F5 → ''Backend: Attach''"'
      - PYTHONPATH="{{.ROOT_DIR}}" DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" {{.BACKEND_DIR}}/.venv/bin/python -m debugpy --listen $DEBUGPY_PORT -m uvicorn backend.api.main:app --reload --port $BACKEND_PORT

  dev:frontend:
    desc: Start frontend locally (Vite)
    dir: "{{.FRONTEND_DIR}}"
    dotenv: [.env, ../.env, ../.env.dev]
    cmds:
      - VITE_API_URL=http://localhost:$BACKEND_PORT npm run dev -- --port $FRONTEND_PORT

  test:
    desc: Start test stack (existing images)
    dotenv: [.env, .env.test]
    cmds:
      - docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-test up -d
      - sleep 3
      - |
        echo ""
        echo "✅ Test stack running"
        echo "   Frontend: http://localhost:${FRONTEND_PORT}"
        echo "   Backend:  http://localhost:${BACKEND_PORT}"
        echo "   Database: localhost:${POSTGRES_PORT}"

  prod:
    desc: Start prod stack (existing images)
    dotenv: [.env, .env.prod]
    cmds:
      - docker compose -f infra/docker/docker-compose.prod.yml -p trades-exporter-prod up -d
      - sleep 3
      - |
        echo ""
        echo "✅ Prod stack running"
        echo "   Frontend: http://localhost:${FRONTEND_PORT}"
        echo "   Backend:  http://localhost:${BACKEND_PORT}"
        echo "   Database: localhost:${POSTGRES_PORT}"
