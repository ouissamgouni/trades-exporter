version: "3"

vars:
  DONT_RELOAD: false
  AUTO_START_DB: true
  DOCKER_COMPOSE_DB: infra/docker/docker-compose.db.yml
  SCENARIO_PORTS_SH: .taskfiles/scenario_ports.sh
  LOG_LEVEL: '{{.LOG_LEVEL | default "DEBUG"}}'
  UVICORN_ACCESS_LOG_EXCLUDE_PATHS: '{{.UVICORN_ACCESS_LOG_EXCLUDE_PATHS | default ""}}'

tasks:
  # ════════════════════════════════════════════════════════════════
  # Dev Environment: Database
  # ════════════════════════════════════════════════════════════════

  dev:db:
    desc: Start dev database only
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    vars:
      RESET: '{{.RESET | default "0"}}'
    cmds:
      - |
        # Dev is just a scenario named "dev" with pinned ports — same compose
        # file and naming rules as every other scenario.
        source {{.SCENARIO_PORTS_SH}} dev
        source {{.ROOT_DIR}}/.taskfiles/scenario_compose.sh {{.ROOT_DIR}}

        # A container from an older compose project holds the name we need.
        # The data volume (trades_dev_data) is NOT touched.
        sc_compose_adopt_containers

        if [ "{{.RESET}}" = "1" ]; then
          echo "🔄 RESET: tearing down dev database (including volume)..."
          docker compose -p $SC_PROJECT_NAME down -v 2>/dev/null || true
        fi

        POSTGRES_DB=$SC_DB_NAME docker compose -p $SC_PROJECT_NAME up -d --wait postgres
      - echo ""
      - echo "✅ Dev database running on localhost:$POSTGRES_PORT"
      - echo ""
      - echo "Next steps:"
      - echo "  task start:dev:backend         - Start backend"
      - echo "  task start:dev:backend:debug   - Start backend with debugger"
      - echo "  task start:dev:frontend        - Start frontend"
      - echo "  task start:dev                 - Start all services"
      - echo "  task start:dev:debug           - Start all with debugging"

  dev:db:check:
    internal: true
    desc: Check if dev database is running
    preconditions:
      - sh: docker ps --filter "name=trades_db_dev" --filter "status=running" --format "{{`{{.Names}}`}}" | grep -q trades_db_dev
        msg: |
          ❌ Dev database not running. Start it first:
             task start:dev:db
             
             Or set AUTO_START_DB=true (default)

  # ════════════════════════════════════════════════════════════════
  # Dev Environment: Full Stack
  # ════════════════════════════════════════════════════════════════

  dev:
    desc: Start full dev environment (DB + backend + frontend). BROWSER=none|shared|isolated, COUNT=N, RESET_BROWSER=1, LOG_LEVEL=debug|info|... (default DEBUG).
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    deps: [dev:db]
    vars:
      RELOAD_FLAG: "{{if .DONT_RELOAD}}{{else}}--reload{{end}}"
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
    cmds:
      - echo ""
      - echo "═══════════════════════════════════════════════════════════════"
      - echo "✅ Starting all services with live logs"
      - echo ""
      - echo "Services:"
      - echo "   [DB]  Database on localhost:$POSTGRES_PORT"
      - echo "   [API] Backend on localhost:$BACKEND_PORT"
      - echo "   [WEB] Frontend on localhost:$FRONTEND_PORT"
      - echo ""
      - echo "Press Ctrl+C to stop all services"
      - echo "═══════════════════════════════════════════════════════════════"
      - echo ""
      - |
        npx concurrently \
          --names "DB,API,WEB,OPEN" \
          --prefix-colors "blue.bold,yellow.bold,green.bold,magenta.bold" \
          --prefix "[{name}] " \
          --kill-others-on-fail \
          "ENV_NAME=dev docker compose -f {{.DOCKER_COMPOSE_DB}} -p trades-exporter-dev logs -f postgres" \
          "cd {{.BACKEND_DIR}} && PYTHONPATH={{.ROOT_DIR}} LOG_LEVEL={{.LOG_LEVEL}} UVICORN_ACCESS_LOG_EXCLUDE_PATHS='{{.UVICORN_ACCESS_LOG_EXCLUDE_PATHS}}' DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB {{.ROOT_DIR}}/.venv/bin/uvicorn backend.api.main:app {{.RELOAD_FLAG}} --port $BACKEND_PORT" \
          "cd {{.FRONTEND_DIR}} && VITE_API_URL=http://localhost:$BACKEND_PORT npm run dev -- --port $FRONTEND_PORT" \
          "until curl -sf http://localhost:$FRONTEND_PORT >/dev/null 2>&1; do sleep 1; done && {{.ROOT_DIR}}/.taskfiles/open-browsers.sh http://localhost:$FRONTEND_PORT {{.BROWSER}} {{.COUNT}} dev {{.RESET_BROWSER}}"

  dev:debug:
    desc: Start full dev environment with debugging. BROWSER=none|shared|isolated, COUNT=N, RESET_BROWSER=1.
    dotenv:
      [
        config/base.env,
        scenarios/dev/config.env,
        config/secrets.env,
        config/secrets.dev.env,
      ]
    deps: [dev:db]
    vars:
      RELOAD_FLAG: "{{if .DONT_RELOAD}}{{else}}--reload{{end}}"
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
    cmds:
      - echo ""
      - echo "═══════════════════════════════════════════════════════════════"
      - echo "✅ Starting all services with live logs (debugger enabled)"
      - echo ""
      - echo "Services:"
      - 'echo "   [DB]  Database on localhost:$POSTGRES_PORT"'
      - 'echo "   [API] Backend on localhost:$BACKEND_PORT (debugger: $DEBUGPY_PORT)"'
      - 'echo "   [WEB] Frontend on localhost:$FRONTEND_PORT"'
      - echo ""
      - 'echo "To attach debugger: VSCode -> F5 -> Backend: Attach"'
      - echo "Press Ctrl+C to stop all services"
      - echo "═══════════════════════════════════════════════════════════════"
      - echo ""
      - |
        npx concurrently \
          --names "DB,API,WEB,OPEN" \
          --prefix-colors "blue.bold,yellow.bold,green.bold,magenta.bold" \
          --prefix "[{name}] " \
          --kill-others-on-fail \
          "ENV_NAME=dev docker compose -f {{.DOCKER_COMPOSE_DB}} -p trades-exporter-dev logs -f postgres" \
          "cd {{.BACKEND_DIR}} && PYTHONPATH={{.ROOT_DIR}} LOG_LEVEL={{.LOG_LEVEL}} UVICORN_ACCESS_LOG_EXCLUDE_PATHS='{{.UVICORN_ACCESS_LOG_EXCLUDE_PATHS}}' DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$POSTGRES_PORT/$POSTGRES_DB {{.ROOT_DIR}}/.venv/bin/python -m debugpy --listen $DEBUGPY_PORT -m uvicorn backend.api.main:app {{.RELOAD_FLAG}} --port $BACKEND_PORT" \
          "cd {{.FRONTEND_DIR}} && VITE_API_URL=http://localhost:$BACKEND_PORT npm run dev -- --port $FRONTEND_PORT" \
          "until curl -sf http://localhost:$FRONTEND_PORT >/dev/null 2>&1; do sleep 1; done && {{.ROOT_DIR}}/.taskfiles/open-browsers.sh http://localhost:$FRONTEND_PORT {{.BROWSER}} {{.COUNT}} dev {{.RESET_BROWSER}}"

  # ════════════════════════════════════════════════════════════════
  # Dev Environment: Individual Components
  # ════════════════════════════════════════════════════════════════

  dev:backend:
    desc: Start backend locally (no debugger)
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/scenarios/dev/config.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    deps:
      - task: dev:db
        vars: { AUTO_START_DB: "{{.AUTO_START_DB}}" }
      - task: dev:db:check
    dir: backend
    env:
      PYTHONPATH: "{{.ROOT_DIR}}"
      LOG_LEVEL: "{{.LOG_LEVEL}}"
      UVICORN_ACCESS_LOG_EXCLUDE_PATHS: "{{.UVICORN_ACCESS_LOG_EXCLUDE_PATHS}}"
    cmds:
      - "{{.ROOT_DIR}}/.venv/bin/python -m backend.api.run"

  dev:backend:debug:
    desc: Start backend with debugger
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/scenarios/dev/config.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    deps:
      - task: dev:db
        vars: { AUTO_START_DB: "{{.AUTO_START_DB}}" }
      - task: dev:db:check
    dir: backend
    env:
      PYTHONPATH: "{{.ROOT_DIR}}"
      LOG_LEVEL: "{{.LOG_LEVEL}}"
      UVICORN_ACCESS_LOG_EXCLUDE_PATHS: "{{.UVICORN_ACCESS_LOG_EXCLUDE_PATHS}}"
    cmds:
      - echo "Starting backend with debugger on port $DEBUGPY_PORT..."
      - 'echo "In VSCode: F5 -> Backend: Attach"'
      - "{{.ROOT_DIR}}/.venv/bin/python -m debugpy --listen $DEBUGPY_PORT -m backend.api.run"

  dev:frontend:
    desc: Start frontend locally (Vite). BROWSER=none|shared|isolated, COUNT=N, RESET_BROWSER=1.
    dotenv:
      [
        "{{.ROOT_DIR}}/config/base.env",
        "{{.ROOT_DIR}}/scenarios/dev/config.env",
        "{{.ROOT_DIR}}/config/secrets.env",
        "{{.ROOT_DIR}}/config/secrets.dev.env",
      ]
    dir: frontend
    vars:
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
    cmds:
      - |
        (until curl -sf http://localhost:$FRONTEND_PORT >/dev/null 2>&1; do sleep 1; done && {{.ROOT_DIR}}/.taskfiles/open-browsers.sh http://localhost:$FRONTEND_PORT {{.BROWSER}} {{.COUNT}} dev {{.RESET_BROWSER}}) &
        VITE_API_URL=http://localhost:$BACKEND_PORT npm run dev -- --port $FRONTEND_PORT

  # ════════════════════════════════════════════════════════════════
  # Staging & Prod: Full Stacks (existing images)
  # ════════════════════════════════════════════════════════════════

  staging:local:
    desc: Start staging stack (existing images). BROWSER=none|shared|isolated, COUNT=N, RESET_BROWSER=1.
    dotenv:
      [
        config/base.env,
        config/staging.local.env,
        config/secrets.env,
        config/secrets.staging.local.env,
      ]
    vars:
      RESET: '{{.RESET | default "0"}}'
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
      FOLLOW: '{{.FOLLOW | default "1"}}'
    cmds:
      - |
        MISSING=0
        for IMG in trades-exporter-backend trades-exporter-frontend; do
          if ! docker image inspect "$IMG:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "❌ Missing local image: $IMG:$IMAGE_TAG"
            MISSING=1
          fi
        done
        if [ "$MISSING" = "1" ]; then
          echo ""
          echo "   Build it first, then retry:"
          echo "     task build:staging"
          echo "     task start:staging:local"
          echo ""
          echo "   Or build + deploy in one step:"
          echo "     task deploy:staging:local"
          exit 1
        fi
      - |
        if [ "{{.RESET}}" = "1" ]; then
          echo "🔄 RESET: tearing down staging stack..."
          ENV_NAME=staging docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging down -v 2>/dev/null || true
        fi
      - ENV_NAME=staging docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging up -d
      - sleep 3
      - 'echo ""'
      - 'echo "✅ Staging stack running"'
      - 'echo "   Frontend: http://localhost:$FRONTEND_PORT"'
      - 'echo "   Backend:  http://localhost:$BACKEND_PORT"'
      - 'echo "   Database: localhost:$POSTGRES_PORT"'
      - './.taskfiles/open-browsers.sh "http://localhost:$FRONTEND_PORT" "{{.BROWSER}}" "{{.COUNT}}" "staging-local" "{{.RESET_BROWSER}}"'
      - |
        if [ "{{.FOLLOW}}" != "0" ]; then
          echo ""
          echo "Following logs (Ctrl+C stops tailing only — the stack keeps running)..."
          ENV_NAME=staging docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-staging logs -f --tail 50
        fi

  prod:local:
    desc: Start prod stack (last deployed :prod images). BROWSER=none|shared|isolated, COUNT=N, RESET_BROWSER=1.
    dotenv:
      [
        config/base.env,
        config/prod.local.env,
        config/secrets.env,
        config/secrets.prod.local.env,
      ]
    vars:
      RESET: '{{.RESET | default "0"}}'
      FORCE: '{{.FORCE | default "0"}}'
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
      FOLLOW: '{{.FOLLOW | default "1"}}'
    cmds:
      - |
        MISSING=0
        for IMG in trades-exporter-backend trades-exporter-frontend; do
          if ! docker image inspect "$IMG:$IMAGE_TAG" >/dev/null 2>&1; then
            echo "❌ Missing local image: $IMG:$IMAGE_TAG"
            MISSING=1
          fi
        done
        if [ "$MISSING" = "1" ]; then
          echo ""
          echo "   Nothing deployed to prod yet. Deploy first:"
          echo "     task release:prod                 (tag + deploy per component)"
          echo "     task deploy:prod:local:cwd        (from the working directory)"
          exit 1
        fi
      - |
        if [ "{{.RESET}}" = "1" ]; then
          if [ "{{.FORCE}}" != "1" ]; then
            echo "🚨 RESET on prod requires FORCE=1. Usage: task start:prod:local RESET=1 FORCE=1"
            exit 1
          fi
          echo "🚨 RESET: tearing down PRODUCTION stack..."
          ENV_NAME=prod docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod down -v 2>/dev/null || true
        fi
      - ENV_NAME=prod docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod up -d
      - sleep 3
      - 'echo ""'
      - 'echo "✅ Prod stack running"'
      - 'echo "   Frontend: http://localhost:$FRONTEND_PORT"'
      - 'echo "   Backend:  http://localhost:$BACKEND_PORT"'
      - 'echo "   Database: localhost:$POSTGRES_PORT"'
      - './.taskfiles/open-browsers.sh "http://localhost:$FRONTEND_PORT" "{{.BROWSER}}" "{{.COUNT}}" "prod-local" "{{.RESET_BROWSER}}"'
      - |
        if [ "{{.FOLLOW}}" != "0" ]; then
          echo ""
          echo "Following logs (Ctrl+C stops tailing only — the stack keeps running)..."
          ENV_NAME=prod docker compose -f infra/docker/docker-compose.unified.yml -p trades-exporter-prod logs -f --tail 50
        fi

  # ════════════════════════════════════════════════════════════════
  # Scenario: Full Docker from git ref
  # ════════════════════════════════════════════════════════════════

  scenario:ref:
    desc: "Build from git ref and start isolated scenario stack. SCENARIO=<name>, WEB_PORT/API_PORT to override resolved ports, BROWSER=none|shared|isolated, COUNT=N, RESET_BROWSER=1, FOLLOW=0 to skip tailing logs in foreground, LOG_LEVEL=debug|info|... (default DEBUG)."
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      REF: "{{if .REF}}{{.REF}}{{else}}{{.CLI_ARGS}}{{end}}"
      BACKEND_REF: "{{.BACKEND_REF | default .REF}}"
      FRONTEND_REF: "{{.FRONTEND_REF | default .REF}}"
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      RESET: '{{.RESET | default "0"}}'
      WEB_PORT: '{{.WEB_PORT | default ""}}'
      API_PORT: '{{.API_PORT | default ""}}'
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
      FOLLOW: '{{.FOLLOW | default "1"}}'
      RESOLVED_API_PORT:
        sh: source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"; [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"; echo "$SC_API_PORT"
      RESOLVED_ENV_NAME:
        sh: source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"; echo "$ENV_NAME"
    cmds:
      - |
        BACKEND_REF="{{.BACKEND_REF}}"
        FRONTEND_REF="{{.FRONTEND_REF}}"
        if [ -z "$BACKEND_REF" ] || [ -z "$FRONTEND_REF" ]; then
          echo "❌ Usage:"
          echo "   task start:scenario:ref -- <ref>                                          # same ref for backend + frontend"
          echo "   task start:scenario:ref -- <ref> SCENARIO=fr_tax"
          echo "   task start:scenario:ref BACKEND_REF=develop FRONTEND_REF=main SCENARIO=demo"
          echo "   task start:scenario:ref BACKEND_REF=workdir FRONTEND_REF=main SCENARIO=demo   # backend from working dir"
          echo ""
          echo "   Note: seeding/migrations run against the BACKEND, so BACKEND_REF must"
          echo "   be a seeding-capable ref (has backend.scripts.seed --seed-dir)."
          exit 1
        fi
      # Build backend + frontend from their (possibly different) refs, both tagged :$ENV_NAME
      - task: :build:scenario-component
        vars:
          {
            COMPONENT: backend,
            REF: "{{.BACKEND_REF}}",
            OUT_TAG: "{{.RESOLVED_ENV_NAME}}",
            BACKEND_PORT: "{{.RESOLVED_API_PORT}}",
          }
      - task: :build:scenario-component
        vars:
          {
            COMPONENT: frontend,
            REF: "{{.FRONTEND_REF}}",
            OUT_TAG: "{{.RESOLVED_ENV_NAME}}",
            BACKEND_PORT: "{{.RESOLVED_API_PORT}}",
          }
      # Tag + deploy
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
        [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"
        export BACKEND_PORT=$SC_API_PORT
        export FRONTEND_PORT=$SC_WEB_PORT
        export LOG_LEVEL="{{.LOG_LEVEL}}"

        # docker-compose.unified.yml reads config/${ENV_NAME}.local.env; every
        # scenario shares config/scenario.env, so symlink it under the resolved name.
        ln -sf scenario.env "{{.ROOT_DIR}}/config/${ENV_NAME}.local.env"

        echo "Cleaning up previous scenario environment ($ENV_NAME)..."
        docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME down -v 2>/dev/null || true

        echo "Starting scenario stack ($ENV_NAME)..."
        docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME up -d

        # Persist actual ports so stop/logs/open tasks can find them even if overridden
        STATE_DIR="{{.ROOT_DIR}}/.taskfiles/.scenario-state"
        mkdir -p "$STATE_DIR"
        SCENARIO_LABEL="{{.SCENARIO}}"; [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"
        printf 'SC_API_PORT=%s\nSC_WEB_PORT=%s\nSC_DB_PORT=%s\nSC_PROJECT_NAME=%s\n' \
          "$SC_API_PORT" "$SC_WEB_PORT" "$SC_DB_PORT" "$SC_PROJECT_NAME" \
          > "$STATE_DIR/$SCENARIO_LABEL.env"
      # Wait for healthy backend
      - task: _wait_healthy
        vars: { SCENARIO: "{{.SCENARIO}}" }
      # Create tables from models + stamp migrations
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        echo "Creating tables from models..."
        docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -c "from backend.db.database import get_engine; from backend.db.models import SQLModel; SQLModel.metadata.create_all(get_engine())"
        echo "Stamping database to current migration..."
        docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m alembic -c backend/alembic.ini stamp head
      # Seed data
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        SEED_DIR="{{.SEED_DIR}}"
        WITH_DEFAULTS="{{.WITH_DEFAULTS}}"
        if [ -z "$SEED_DIR" ] && [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          CANDIDATE="{{.ROOT_DIR}}/scenarios/{{.SCENARIO}}"
          if [ -d "$CANDIDATE" ]; then
            SEED_DIR="$CANDIDATE"
            echo "Auto-resolved SEED_DIR from SCENARIO={{.SCENARIO}}"
          fi
        fi
        if [ -n "$SEED_DIR" ]; then
          if [ "$WITH_DEFAULTS" = "1" ]; then
            echo "Seeding default data first (WITH_DEFAULTS=1)..."
            docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed
          fi
          echo "Seeding scenario from $SEED_DIR..."
          docker cp "$SEED_DIR/." $SC_BACKEND_CONTAINER:/tmp/scenario/
          docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed --seed-dir /tmp/scenario
        else
          echo "Seeding default data..."
          docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec backend python -m backend.scripts.seed
        fi
      # Summary
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
        [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"
        BACKEND_REF="{{.BACKEND_REF}}"
        FRONTEND_REF="{{.FRONTEND_REF}}"
        SEED_DIR="{{.SEED_DIR}}"
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "✅ Scenario environment ready ($ENV_NAME)"
        echo ""
        if [ "$BACKEND_REF" = "$FRONTEND_REF" ]; then
          echo "   Source ref:   $BACKEND_REF"
        else
          echo "   Backend ref:  $BACKEND_REF"
          echo "   Frontend ref: $FRONTEND_REF"
        fi
        if [ -n "$SEED_DIR" ]; then
          echo "   Scenario: $SEED_DIR"
        elif [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          echo "   Scenario: {{.SCENARIO}}"
        fi
        echo ""
        echo "   Frontend: http://localhost:$SC_WEB_PORT"
        echo "   Backend:  http://localhost:$SC_API_PORT"
        echo "   Database: localhost:$SC_DB_PORT"
        echo ""
        echo "Commands:"
        echo "   task status                                 → All environments"
        echo "   task logs:scenario SCENARIO={{.SCENARIO}}    → Tail logs"
        echo "   task stop:scenario SCENARIO={{.SCENARIO}}    → Stop this instance"
        echo "   task stop:scenario:all                       → Stop all scenarios"
        echo "════════════════════════════════════════════════════════════"
        ./.taskfiles/open-browsers.sh "http://localhost:$SC_WEB_PORT" "{{.BROWSER}}" "{{.COUNT}}" "scenario-$ENV_NAME" "{{.RESET_BROWSER}}"

        if [ "{{.FOLLOW}}" != "0" ]; then
          echo ""
          echo "Following logs (Ctrl+C stops tailing only — the stack keeps running)..."
          docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME logs -f --tail 50
        fi

  # ════════════════════════════════════════════════════════════════
  # Scenario: Local code + Docker DB (default, like start:dev)
  # ════════════════════════════════════════════════════════════════

  scenario:
    desc: "Start scenario with local code (DB Docker, backend+frontend local, live reload). SCENARIO=<name>, WEB_PORT/API_PORT to override resolved ports, BROWSER=none|shared|isolated, LOG_LEVEL=debug|info|... (default DEBUG)."
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      RESET: '{{.RESET | default "0"}}'
      WEB_PORT: '{{.WEB_PORT | default ""}}'
      API_PORT: '{{.API_PORT | default ""}}'
      BROWSER: '{{.BROWSER | default "none"}}'
      COUNT: '{{.COUNT | default "1"}}'
      RESET_BROWSER: '{{.RESET_BROWSER | default "0"}}'
    cmds:
      - |
        # Restarting local dev-loop processes (backend/frontend) is this
        # task's own responsibility — scenario:_setup_db only ever manages
        # the DB, never frontend/backend dev processes, so it's safe to
        # reuse from automated-test contexts (Playwright/CI) too.
        if [ "{{.RESET}}" = "1" ]; then
          source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
          [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
          pkill -f "vite.*--port $SC_WEB_PORT" 2>/dev/null || true
        fi
      - task: scenario:_setup_db
        vars:
          SCENARIO: "{{.SCENARIO}}"
          SEED_DIR: "{{.SEED_DIR}}"
          WITH_DEFAULTS: "{{.WITH_DEFAULTS}}"
          RESET: "{{.RESET}}"
          WEB_PORT: "{{.WEB_PORT}}"
          API_PORT: "{{.API_PORT}}"
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
        [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"
        echo ""
        echo "═══════════════════════════════════════════════════════════════"
        echo "✅ Starting scenario dev mode ($ENV_NAME) with live reload"
        echo ""
        echo "   [DB]  Scenario Database on localhost:$SC_DB_PORT"
        echo "   [API] Backend on localhost:$SC_API_PORT"
        echo "   [WEB] Frontend on localhost:$SC_WEB_PORT"
        echo ""
        echo "Press Ctrl+C to stop backend + frontend (DB stays running)"
        echo "Run 'task stop:scenario SCENARIO={{.SCENARIO}}' to stop everything"
        echo "═══════════════════════════════════════════════════════════════"
        echo ""
      # Run backend + frontend with live reload (foreground, blocking)
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
        [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"
        SCENARIO_LABEL="{{.SCENARIO}}"
        [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"
        npx concurrently \
          --names "API:$SCENARIO_LABEL,WEB:$SCENARIO_LABEL,OPEN:$SCENARIO_LABEL" \
          --prefix-colors "yellow.bold,green.bold,magenta.bold" \
          --prefix "[{name}] " \
          --kill-others-on-fail \
          "cd {{.BACKEND_DIR}} && PYTHONPATH={{.ROOT_DIR}} LOG_LEVEL={{.LOG_LEVEL}} DATABASE_URL=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB {{.ROOT_DIR}}/.venv/bin/uvicorn backend.api.main:app --reload --port $SC_API_PORT" \
          "cd {{.FRONTEND_DIR}} && VITE_API_URL=http://localhost:$SC_API_PORT npm run dev -- --port $SC_WEB_PORT" \
          "until curl -sf http://localhost:$SC_WEB_PORT >/dev/null 2>&1; do sleep 1; done && {{.ROOT_DIR}}/.taskfiles/open-browsers.sh http://localhost:$SC_WEB_PORT {{.BROWSER}} {{.COUNT}} scenario-$SCENARIO_LABEL {{.RESET_BROWSER}}"

  scenario:db:
    desc: "Start ONLY the scenario database (Docker Postgres, schema migrated + seeded) — no backend, no frontend. A lightweight, portable DB fixture for backend integration tests. SCENARIO=<name>. Use 'task stop:scenario SCENARIO=<name>' to tear down."
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      RESET: '{{.RESET | default "0"}}'
    cmds:
      - task: scenario:_setup_db
        vars:
          SCENARIO: "{{.SCENARIO}}"
          SEED_DIR: "{{.SEED_DIR}}"
          WITH_DEFAULTS: "{{.WITH_DEFAULTS}}"
          RESET: "{{.RESET}}"

  scenario:backend:
    desc: "Start scenario DB + backend only, in the background, for automated tests (Playwright/CI). Returns immediately. SCENARIO=<name>. Use 'task stop:scenario SCENARIO=<name>' to tear down."
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      RESET: '{{.RESET | default "0"}}'
      WEB_PORT: '{{.WEB_PORT | default ""}}'
      API_PORT: '{{.API_PORT | default ""}}'
    cmds:
      - task: scenario:_setup_db
        vars:
          SCENARIO: "{{.SCENARIO}}"
          SEED_DIR: "{{.SEED_DIR}}"
          WITH_DEFAULTS: "{{.WITH_DEFAULTS}}"
          RESET: "{{.RESET}}"
          WEB_PORT: "{{.WEB_PORT}}"
          API_PORT: "{{.API_PORT}}"
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
        [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"
        STATE_DIR="{{.ROOT_DIR}}/.taskfiles/.scenario-state"
        SCENARIO_LABEL="{{.SCENARIO}}"; [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"

        echo "Starting backend in background (detached, no reload) on port $SC_API_PORT..."
        cd {{.BACKEND_DIR}}
        PYTHONPATH="{{.ROOT_DIR}}" LOG_LEVEL="{{.LOG_LEVEL}}" \
        DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
          nohup {{.ROOT_DIR}}/.venv/bin/uvicorn backend.api.main:app --port $SC_API_PORT \
          > "$STATE_DIR/$SCENARIO_LABEL.backend.log" 2>&1 &
        echo $! > "$STATE_DIR/$SCENARIO_LABEL.backend.pid"
        cd {{.ROOT_DIR}}

        echo "Waiting for backend to become healthy..."
        RETRIES=30
        while [ $RETRIES -gt 0 ]; do
          if curl -sf "http://localhost:$SC_API_PORT/health" >/dev/null 2>&1 || curl -sf "http://localhost:$SC_API_PORT/docs" >/dev/null 2>&1; then
            echo "✅ Backend healthy on localhost:$SC_API_PORT"
            break
          fi
          RETRIES=$((RETRIES - 1))
          sleep 1
        done
        if [ $RETRIES -eq 0 ]; then
          echo "❌ Backend failed to become healthy — check $STATE_DIR/$SCENARIO_LABEL.backend.log"
          exit 1
        fi

        echo ""
        echo "✅ Scenario '$SCENARIO_LABEL' ready (detached): DB localhost:$SC_DB_PORT, API localhost:$SC_API_PORT"
        echo "   Stop with: task stop:scenario SCENARIO={{.SCENARIO}}"

  # ════════════════════════════════════════════════════════════════
  # Internal helpers
  # ════════════════════════════════════════════════════════════════

  scenario:_setup_db:
    internal: true
    desc: "Bootstrap the scenario Docker DB + schema + seed. DB-only — never touches backend/frontend processes. Shared by scenario:, scenario:db and scenario:backend."
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SEED_DIR: "{{.SEED_DIR}}"
      SCENARIO: '{{.SCENARIO | default ""}}'
      WITH_DEFAULTS: '{{.WITH_DEFAULTS | default "0"}}'
      RESET: '{{.RESET | default "0"}}'
      WEB_PORT: '{{.WEB_PORT | default ""}}'
      API_PORT: '{{.API_PORT | default ""}}'
    cmds:
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        [ -n "{{.WEB_PORT}}" ] && SC_WEB_PORT="{{.WEB_PORT}}"
        [ -n "{{.API_PORT}}" ] && SC_API_PORT="{{.API_PORT}}"

        # Persist actual ports so stop/logs/open tasks can find them even if overridden
        STATE_DIR="{{.ROOT_DIR}}/.taskfiles/.scenario-state"
        mkdir -p "$STATE_DIR"
        SCENARIO_LABEL="{{.SCENARIO}}"; [ -z "$SCENARIO_LABEL" ] && SCENARIO_LABEL="default"
        printf 'SC_API_PORT=%s\nSC_WEB_PORT=%s\nSC_DB_PORT=%s\nSC_PROJECT_NAME=%s\n' \
          "$SC_API_PORT" "$SC_WEB_PORT" "$SC_DB_PORT" "$SC_PROJECT_NAME" \
          > "$STATE_DIR/$SCENARIO_LABEL.env"

        # ── RESET cleanup ── (DB + backend only; frontend lifecycle is the
        # caller's responsibility — see scenario:'s own pkill step above)
        if [ "{{.RESET}}" = "1" ]; then
          echo "🔄 Restarting: stopping existing scenario environment ($ENV_NAME) first..."
          docker compose -f {{.DOCKER_COMPOSE_DB}} -p $SC_PROJECT_NAME down -v 2>/dev/null || true
          pkill -f "uvicorn.*--port $SC_API_PORT" 2>/dev/null || true
          echo "✅ Previous environment cleaned"
        fi

        # ── Start scenario database ──
        echo "Starting scenario database ($ENV_NAME on port $SC_DB_PORT)..."
        docker compose -f {{.DOCKER_COMPOSE_DB}} -p $SC_PROJECT_NAME up -d postgres

        # ── Wait for DB healthy ──
        echo "Waiting for scenario database..."
        RETRIES=15
        while [ $RETRIES -gt 0 ]; do
          if docker ps --filter "name=$SC_DB_CONTAINER" --filter "health=healthy" --format '{{`{{.Names}}`}}' | grep -q "$SC_DB_CONTAINER"; then
            echo "✅ Scenario database healthy"
            break
          fi
          RETRIES=$((RETRIES - 1))
          echo "   Waiting... ($RETRIES retries left)"
          sleep 2
        done
        if [ $RETRIES -eq 0 ]; then
          echo "❌ Scenario database failed to become healthy"
          exit 1
        fi

        # ── Ensure database exists ──
        echo "Ensuring database $POSTGRES_DB exists..."
        PGPASSWORD=$POSTGRES_PASSWORD docker exec $SC_DB_CONTAINER \
          psql -U $POSTGRES_USER -d postgres -tc \
          "SELECT 1 FROM pg_database WHERE datname = '$POSTGRES_DB'" | grep -q 1 || \
        PGPASSWORD=$POSTGRES_PASSWORD docker exec $SC_DB_CONTAINER \
          psql -U $POSTGRES_USER -d postgres -c "CREATE DATABASE $POSTGRES_DB"

        # ── Resolve SEED_DIR ──
        SEED_DIR="{{.SEED_DIR}}"
        if [ -z "$SEED_DIR" ] && [ -n "{{.SCENARIO}}" ] && [ "{{.SCENARIO}}" != "default" ]; then
          CANDIDATE="{{.ROOT_DIR}}/scenarios/{{.SCENARIO}}"
          if [ -d "$CANDIDATE" ]; then
            SEED_DIR="$CANDIDATE"
            echo "Auto-resolved SEED_DIR from SCENARIO={{.SCENARIO}}"
          fi
        fi

        # ── Create tables + stamp + check + seed (shared script) ──
        ROOT_DIR="{{.ROOT_DIR}}" \
        DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:$SC_DB_PORT/$POSTGRES_DB" \
        SEED_DIR="$SEED_DIR" \
        WITH_DEFAULTS="{{.WITH_DEFAULTS}}" \
          {{.ROOT_DIR}}/.taskfiles/db_bootstrap.sh

  _wait_healthy:
    internal: true
    dotenv:
      [
        config/base.env,
        config/scenario.env,
        config/secrets.env,
        config/secrets.scenario.env,
      ]
    vars:
      SCENARIO: '{{.SCENARIO | default ""}}'
    cmds:
      - |
        source {{.SCENARIO_PORTS_SH}} "{{.SCENARIO}}"
        echo "Waiting for backend to be healthy..."
        RETRIES=30
        while [ $RETRIES -gt 0 ]; do
          if docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME exec -T backend python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" 2>/dev/null; then
            echo "✅ Backend healthy"
            break
          fi
          RETRIES=$((RETRIES - 1))
          echo "   Waiting... ($RETRIES retries left)"
          sleep 3
        done
        if [ $RETRIES -eq 0 ]; then
          echo "❌ Backend failed to become healthy"
          docker compose -f infra/docker/docker-compose.unified.yml -p $SC_PROJECT_NAME logs backend --tail 20
          exit 1
        fi
