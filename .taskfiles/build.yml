version: "3"

tasks:
  test:
    desc: Build both backend and frontend images from develop branch
    dotenv: [.env, .env.test]
    deps: [test:backend, test:frontend]
    cmds:
      - echo "✅ All test images built (:develop)"

  test:backend:
    desc: Build backend image from develop branch
    dotenv: [.env, .env.test]
    cmds:
      - git checkout develop
      - git pull origin develop
      - |
        echo "Building backend from develop..."
        docker build -t trades-exporter-backend:develop -f backend/Dockerfile .
        echo "✅ Backend image built: :develop"

  test:frontend:
    desc: Build frontend image from develop branch
    dotenv: [.env, .env.test]
    cmds:
      - git checkout develop
      - git pull origin develop
      - |
        echo "Building frontend from develop..."
        docker build -t trades-exporter-frontend:develop \
          --build-arg VITE_API_URL=http://localhost:$BACKEND_PORT \
          ./frontend
        echo "✅ Frontend image built: :develop"

  prod:
    desc: Build both backend and frontend images from main branch (e.g., task build:prod v1.2.0)
    dotenv: [.env, .env.prod]
    cmds:
      - task: prod:backend
        vars: { VERSION: "{{.CLI_ARGS}}" }
      - task: prod:frontend
        vars: { VERSION: "{{.CLI_ARGS}}" }
      - cmd: echo "✅ All prod images built{{if .CLI_ARGS}} :{{.CLI_ARGS}} and :latest{{end}}"

  prod:backend:
    desc: Build backend image from main branch (e.g., task build:prod:backend v1.2.0)
    dotenv: [.env, .env.prod]
    cmds:
      - |
        VERSION={{.VERSION}}{{.CLI_ARGS}}
        if [ -z "$VERSION" ]; then
          echo "❌ Usage: task build:prod:backend v1.2.0"
          exit 1
        fi
        git checkout main
        git pull origin main
        echo "Building backend from main as $VERSION..."
        docker build -t trades-exporter-backend:$VERSION -f backend/Dockerfile .
        docker tag trades-exporter-backend:$VERSION trades-exporter-backend:latest
        echo "✅ Backend image built: :$VERSION and :latest"

  prod:frontend:
    desc: Build frontend image from main branch (e.g., task build:prod:frontend v1.2.0)
    dotenv: [.env, .env.prod]
    cmds:
      - |
        VERSION={{.VERSION}}{{.CLI_ARGS}}
        if [ -z "$VERSION" ]; then
          echo "❌ Usage: task build:prod:frontend v1.2.0"
          exit 1
        fi
        git checkout main
        git pull origin main
        echo "Building frontend from main as $VERSION..."
        docker build -t trades-exporter-frontend:$VERSION \
          --build-arg VITE_API_URL=http://localhost:$BACKEND_PORT \
          ./frontend
        docker tag trades-exporter-frontend:$VERSION trades-exporter-frontend:latest
        echo "✅ Frontend image built: :$VERSION and :latest"

  list:
    desc: List all trades-exporter Docker images
    cmds:
      - docker images trades-exporter-* --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}"

  clean:
    desc: Remove old/dangling Docker images
    cmds:
      - |
        echo "Current images:"
        docker images trades-exporter-* --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
        echo ""
        echo "Removing dangling images..."
        docker image prune -f
        echo ""
        echo "✅ Cleanup complete"
        echo ""
        echo "Remaining images:"
        docker images trades-exporter-* --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"

  clean:all:
    desc: "⚠️ Remove ALL trades-exporter Docker images"
    prompt: This will remove ALL trades-exporter images. Continue?
    cmds:
      - docker rmi $(docker images trades-exporter-* -q) --force 2>/dev/null || true
      - echo "✅ All trades-exporter images removed"
