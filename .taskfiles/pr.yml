version: "3"

tasks:
  default:
    desc: Push and create draft PR to develop
    cmds:
      - |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; then
          echo "❌ Cannot create PR from $BRANCH branch"
          exit 1
        fi
        git push -u origin $BRANCH
        gh pr create --draft --base develop --fill
        echo "✅ Draft PR created"

  publish:
    desc: Push and create ready PR to develop
    cmds:
      - |
        BRANCH=$(git branch --show-current)
        if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; then
          echo "❌ Cannot create PR from $BRANCH branch"
          exit 1
        fi
        git push -u origin $BRANCH
        gh pr create --base develop --fill
        echo "✅ PR created (ready for review)"

  ready:
    desc: Mark current draft PR as ready for review
    cmds:
      - gh pr ready
      - echo "✅ PR marked as ready"

  view:
    desc: Open current PR in browser
    cmds:
      - gh pr view --web

  checks:
    desc: Show CI status for current PR
    cmds:
      - gh pr checks

  merge:
    desc: Merge current PR (squash)
    cmds:
      - gh pr merge --squash --delete-branch
      - echo "✅ PR merged"
