force_rewrite: true
base_currency: "EUR"

source_base: "data/input"
export_base: "data/output"
database_path: "data/trades.db"

# Use database-configured connectors (respects Account.enabled and AccountConnector.enabled)
use_database_connectors: true

log_level_root: "WARNING"
log_level_trade_exporter: "DEBUG"

# ============================================================================
# Mock Price Service Configuration (for testing)
# ============================================================================
# Set to "mock" to force ALL assets to use random mock prices.
# Useful for quick manual testing without hitting external price APIs.
# Environment variable PRICE_GETTER_OVERRIDE takes precedence.
price_getter_override: null # Options: null (disabled), "mock"

# Seed for mock price generator (optional, for reproducible tests)
# Environment variable MOCK_PRICES_SEED takes precedence.
mock_prices_seed: null # Options: null (random), any integer (deterministic)

# Grouping Engine Configuration
grouping_engine:
  # Time windows (in seconds)
  transfer_time_window: 300 # 5 minutes - max time between outflow and inflow for transfers
  swap_time_window: 60 # 1 minute - max time between legs of a swap
  bridge_time_window: 60 # 1 minute - max time for cross-chain bridge transactions

  # Tolerances (as decimals, e.g., 0.05 = 5%)
  quantity_tolerance: 0.10 # Max quantity difference ratio for matching transfers/bridges
  value_tolerance: 0.10 # Max value difference ratio for high-confidence swap detection

  # Confidence thresholds
  exact_match_confidence: 1.0 # Network TX hash exact match
  high_confidence: 0.95 # Strong match criteria met
  medium_confidence: 0.85 # Moderate match criteria
  low_confidence: 0.70 # Time-only match (no value confirmation)

# Web3 Wallets Configuration
web3_wallets:
  etherscan_api_key: "T8IVQJ7Q2DZH2JHK7PKVRP11URI3HADZU2" # Etherscan API key for all EVM chains
  request_delay: 1.25 # seconds between API calls to respect rate limits
  max_retries: 7 # retry attempts if free-tier temporarily unavailable
  addresses:
    - wallet_address: "0x347681ec529f767dafB3703486570Bc3Da136993"
      chain_name: "ethereum"
      scanner: "blockscout" #"etherscan-api"
