# Account and Connector Configuration
# ====================================
# This file defines accounts (CEX, wallets) and their associated connectors.
# Run: python -m backend.db.seed to seed the database with this configuration.
#
# Credentials Reference Format:
#   - env:VAR_NAME - Read from environment variable
#   - vault:path/to/secret - (Future) Read from HashiCorp Vault
#
# Connector Types:
#   CEX:
#     - binance-transactions, binance-deposits, binance-withdrawals
#     - coinbase-transactions
#     - mexc-transactions
#     - okx-transactions, okx-convert
#   On-chain:
#     - blockscout (supports: base, ethereum, bnb, polygon, arbitrum, optimism)
#     - etherscan (supports: ethereum)
#     - bscscan (supports: bnb)

accounts:
  # =========================================================================
  # CEX Accounts
  # =========================================================================

  # Binance Main Account
  - name: "Binance Main"
    account_type: "cex"
    address_or_identifier: "binance_main"
    tags: ["trading", "spot"]
    connectors:
      - connector_type: "binance-transactions"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 10
        config:
          start_date: "2024-01-01"

      - connector_type: "binance-deposits"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 20
        config:
          start_date: "2024-01-01"

      - connector_type: "binance-withdrawals"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 30
        config:
          start_date: "2024-01-01"

  # MEXC Account
  - name: "MEXC Main"
    account_type: "cex"
    address_or_identifier: "mexc_main"
    tags: ["trading", "spot"]
    connectors:
      - connector_type: "mexc-transactions"
        enabled: true
        credentials_ref: "env:MEXC_API_KEY"
        sync_priority: 10
        config:
          start_date: "2024-01-01"

  # OKX Account
  - name: "OKX Main"
    account_type: "cex"
    address_or_identifier: "okx_main"
    tags: ["trading", "spot"]
    connectors:
      - connector_type: "okx-transactions"
        enabled: true
        credentials_ref: "env:OKX_API_KEY"
        sync_priority: 10
        config:
          start_date: "2024-01-01"

      - connector_type: "okx-convert"
        enabled: true
        credentials_ref: "env:OKX_API_KEY"
        sync_priority: 20
        config:
          start_date: "2024-01-01"

  # Coinbase Account
  - name: "Coinbase Main"
    account_type: "cex"
    address_or_identifier: "coinbase_main"
    tags: ["trading", "spot"]
    connectors:
      - connector_type: "coinbase-transactions"
        enabled: true
        credentials_ref: "env:COINBASE_API_KEY"
        sync_priority: 10
        config:
          start_date: "2024-01-01"

  # =========================================================================
  # Broker Accounts
  # =========================================================================

  # Degiro Broker Account
  - name: "Degiro"
    account_type: "broker"
    address_or_identifier: "degiro_main"
    tags: ["stocks", "etf"]
    connectors: []

  # =========================================================================
  # Wallet Accounts (On-chain)
  # =========================================================================

  # Base L2 Main Wallet
  - name: "Base Main Wallet"
    account_type: "wallet"
    address_or_identifier: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
    tags: ["defi", "base", "l2"]
    connectors:
      - connector_type: "blockscout"
        enabled: true
        sync_priority: 10
        config:
          chain: "base"
          address: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
          include_internal_txs: true
          include_token_transfers: true

  # Ethereum Mainnet Wallet
  - name: "ETH Main Wallet"
    account_type: "wallet"
    address_or_identifier: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
    tags: ["defi", "ethereum", "l1"]
    connectors:
      - connector_type: "etherscan"
        enabled: true
        credentials_ref: "env:ETHERSCAN_API_KEY"
        sync_priority: 10
        config:
          chain: "ethereum"
          address: "0x742d35Cc6634C0532925a3b844Bc454e4438f44e"
          include_internal_txs: true
          include_token_transfers: true
# =========================================================================
