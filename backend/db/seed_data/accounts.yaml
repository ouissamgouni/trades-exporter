# Account and Connector Configuration
# ====================================
# This file defines accounts (CEX, wallets) and their associated connectors.
# Run: python -m backend.db.seed to seed the database with this configuration.
#
# Credentials Reference Format:
#   - env:VAR_NAME - Read from environment variable
#   - vault:path/to/secret - (Future) Read from HashiCorp Vault
#
# Connector Types:
#   CEX:
#     - binance-transactions, binance-deposits, binance-withdrawals
#     - coinbase-transactions, coinbase-deposits, coinbase-withdrawals
#     - mexc-transactions, mexc-deposits, mexc-withdrawals
#     - okx-transactions, okx-convert, okx-deposits, okx-withdrawals
#   On-chain:
#     - blockscout (supports: base, ethereum, bnb, polygon, arbitrum, optimism)
#     - etherscan (supports: ethereum)
#     - bscscan (supports: bnb)

accounts:
  # =========================================================================
  # CEX Accounts
  # =========================================================================

  # Binance Main Account
  - name: "Binance"
    account_type: "cex"
    address_or_identifier: "binance_main"
    tags:
      - trading: true
      - spot: true
    connectors:
      - connector_type: "binance-transactions"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 10
        config:
          start_date: "2024-01-01"

      - connector_type: "binance-deposits"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 20
        config:
          start_date: "2024-01-01"

      - connector_type: "binance-withdrawals"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 30
        config:
          start_date: "2024-01-01"

  # MEXC Account
  - name: "MEXC"
    account_type: "cex"
    address_or_identifier: "mexc_main"
    tags:
      - trading: true
      - spot: true
    connectors:
      - connector_type: "mexc-transactions"
        enabled: true
        credentials_ref: "env:MEXC_API_KEY"
        sync_priority: 10
        config:
          start_date: "2024-01-01"

      - connector_type: "mexc-deposits"
        enabled: false
        credentials_ref: "env:MEXC_API_KEY"
        sync_priority: 20
        config:
          start_date: "2024-01-01"

      - connector_type: "mexc-withdrawals"
        enabled: false
        credentials_ref: "env:MEXC_API_KEY"
        sync_priority: 30
        config:
          start_date: "2024-01-01"

      - connector_type: "mexc-transactions-file"
        enabled: false
        sync_priority: 15
        config: {}

      - connector_type: "mexc-deposits-file"
        enabled: false
        sync_priority: 25
        config: {}

      - connector_type: "mexc-withdrawals-file"
        enabled: false
        sync_priority: 35
        config: {}

  # OKX Account
  - name: "OKX"
    account_type: "cex"
    address_or_identifier: "okx_main"
    connectors:
      - connector_type: "okx-transactions"
        enabled: true
