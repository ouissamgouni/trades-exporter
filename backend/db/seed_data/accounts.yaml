  # Wallet Accounts (On-chain)
  # =========================================================================

  # Tangem EVM Wallets (split per chain, grouped)
  - name: "Tangem Ethereum"
    account_type: "wallet"
    group: "Tangem EVM"
    address_or_identifier: "0x347681ec529f767dafB3703486570Bc3Da136993"
    connectors:
      - connector_type: "etherscan"
        enabled: false
        credentials_ref: "env:ETHERSCAN_API_KEY"
        sync_priority: 10
        config:
          chain: "ethereum"
          include_internal_txs: true
          include_token_transfers: true
      - connector_type: "blockscout"
