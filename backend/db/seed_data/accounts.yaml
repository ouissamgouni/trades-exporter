        enabled: false
        credentials_ref: "env:MEXC_API_KEY"
        sync_priority: 30
        config:
          start_datetime: "2025-10-01T00:00:00"

      - connector_type: "mexc-transactions-file"
        color: "#D46B08"
        enabled: false
        sync_priority: 15
        default_file: "mexc/mexc-trades-2026-01-15 10_57_00.xlsx"
