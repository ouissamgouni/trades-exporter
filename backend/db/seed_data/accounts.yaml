# Account and Connector Configuration
# ====================================
# This file defines accounts (CEX, wallets) and their associated connectors.
# Run: python -m backend.db.seed to seed the database with this configuration.
#
# Credentials Reference Format:
#   - env:VAR_NAME - Read from environment variable
#   - vault:path/to/secret - (Future) Read from HashiCorp Vault
#
# Connector Types:
#   CEX:
#     - binance-transactions, binance-deposits, binance-withdrawals
#     - coinbase-transactions, coinbase-deposits, coinbase-withdrawals
#     - mexc-transactions, mexc-deposits, mexc-withdrawals
#     - okx-transactions, okx-convert, okx-deposits, okx-withdrawals
#   On-chain:
#     - blockscout (supports: base, ethereum, bnb, polygon, arbitrum, optimism)
#     - etherscan (supports: ethereum)
#     - bscscan (supports: bnb)

accounts:
  # =========================================================================
  # CEX Accounts
  # =========================================================================

  # Binance Main Account
  - name: "Binance"
    account_type: "cex"
    group: "Trading"
    color: "#1F6F9F"
    address_or_identifier: "binance_main"
    tags:
      - trading: true
      - spot: true
    connectors:
      - connector_type: "binance-transactions"
        color: "#1A4971"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 10
        config:
          start_datetime: "2025-10-01T00:00:00"

      - connector_type: "binance-deposits"
        color: "#1E7A6D"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 20
        config:
          start_datetime: "2025-10-01T00:00:00"

      - connector_type: "binance-withdrawals"
        color: "#3A7D44"
        enabled: true
        credentials_ref: "env:BINANCE_API_KEY"
        sync_priority: 30
        config:
          start_datetime: "2025-10-01T00:00:00"

  # MEXC Account
  - name: "MEXC"
    account_type: "cex"
