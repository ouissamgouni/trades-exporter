# French Tax Scenario — Assets
# ==============================
# Base currency must be seeded for the PnL engine to function.
# Other assets referenced by transactions are also included.

assets:
  - symbol: EUR
    label: Euro
    price_type: fiat

  - symbol: USD
    label: US Dollar
    price_type: fiat

  - symbol: BTC
    label: Bitcoin
    price_type: crypto

  - symbol: ETH
    label: Ethereum
    price_type: crypto

  - symbol: AAPL
    label: Apple Inc.
    price_type: stock
