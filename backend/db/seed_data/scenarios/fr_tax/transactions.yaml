# French Tax Scenario — Multi-Year Transactions
# ================================================
# Tests French tax computation across 3 tax years (2023, 2024, 2025) with
# different asset types, envelopes, gain/loss, cross-year positions, and
# loss carryforward between years.
#
# All transactions tagged for identification. Uses accounts and assets
# from the fr_tax scenario seed data.
#
# Year-by-year summary:
#
#   2023 — Initial positions
#     1. Buy 1 BTC @ 25k (Binance CTO)
#     2. Buy 2 ETH @ 1.8k (Binance CTO)
#     3. Buy 10 AAPL @ 150 (Degiro CTO)
#     4. Buy 10 AAPL @ 150 (Degiro PEA — tax-exempt envelope)
#
#   2024 — First disposals + partial rebalance
#     5. Sell 0.5 BTC @ 35k  → crypto gain (Art. 150 VH bis)
#     6. Sell 1 ETH @ 1.5k   → crypto loss
#     7. Sell 5 AAPL @ 200 (CTO) → securities gain (CUMP)
#     8. Sell 5 AAPL @ 200 (PEA) → excluded from tax
#     9. Buy 1 BTC @ 38k     → cost basis averaging
#
#   2025 — Second wave + swap + transfer
#    10. Sell 0.3 BTC @ 60k  → crypto gain (cross-year position from 2023+2024)
#    11. Sell 0.5 ETH @ 3.5k → crypto gain (reversal from 2024 loss)
#    12. Sell 5 AAPL @ 220 (CTO) → securities gain (CUMP updated by 2024 buy)
#    13. BTC→ETH swap: 0.1 BTC → 1.5 ETH → taxable or not depending on config
#    14. Internal transfer: 0.2 BTC Binance → MEXC (non-taxable)

