[pytest]
pythonpath = ..
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests (fast, isolated)
    integration: integration tests (slower, external dependencies)
    network: tests that require network access (may be flaky)

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Filter warnings from third-party dependencies that we cannot fix
filterwarnings =
    ignore::DeprecationWarning:pandas_datareader.*
    ignore::PendingDeprecationWarning:starlette.*
    # Pydantic serializer warnings about legacy data format (handled by field validators)
    ignore:Pydantic serializer warnings:UserWarning:pydantic

# Output capture settings
# addopts = -s  # Uncomment to always show print output
# addopts = -v -s  # Verbose with print output
# addopts = --tb=short -s  # Short traceback with prints

# Live logging (alternative to print statements)
# Set log_cli = true to enable live logging during tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Capture logging for failed tests
log_auto_indent = true
