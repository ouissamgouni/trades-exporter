[pytest]
pythonpath = .. .
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: unit tests (fast, isolated)
    integration: integration tests (slower, external dependencies)
    network: tests that require network access (may be flaky)
    e2e: end-to-end tests (require full infrastructure)

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options: short tracebacks, quiet output, 60s per-test timeout.
# E2E/integration/network tests must be requested explicitly so a plain pytest run
# cannot start real sync jobs or hit live services by accident.
addopts = --tb=short -q --timeout=60 -m "not integration and not e2e and not network"

# Filter warnings from third-party dependencies that we cannot fix
filterwarnings =
    ignore::DeprecationWarning:pandas_datareader.*
    ignore::PendingDeprecationWarning:starlette.*
    # Pydantic serializer warnings about legacy data format (handled by field validators)
    ignore:Pydantic serializer warnings:UserWarning:pydantic

# Disable verbose live logging by default (enable with --log-cli-level=INFO)
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Capture logging for failed tests
log_auto_indent = true
